	<script>
		// 全局参数 G 控制逻辑
		if (sessionStorage.getItem('G') === null) {
			sessionStorage.setItem('G', '0');
		}
		function getG() { return parseInt(sessionStorage.getItem('G')); }
		function setG1() { sessionStorage.setItem('G', '1'); }

		function goProduct(id) {
			if (id === 4) {
				window.location.href = './chanpin1-ai-en.html';
			} else if (getG() === 1) {
				window.location.href = './chanpin1-en.html?id=' + id;
			} else {
				setG1();
				window.location.href = './index-aboutus-en.html?id=' + id;
			}
		}

		// 容器获取
		const imgPcWrap = document.getElementById('imgPcWrap');
		const imgMdWrap = document.getElementById('imgMdWrap');
		const txtWrap = document.getElementById('txtWrap');
		const iconBoxWrap = document.getElementById('iconBoxWrap');

		const apiUrl = `${SERVER_BASE_URL}/website/product`;
		let productListData = [];

		window.onload = function () {
			loadProductData();
		};

		function loadProductData() {
			fetch(apiUrl)
				.then(res => res.json())
				.then(resData => {
					console.log("=== API 完整返回 ===");
					console.log(resData);
					if (resData.code !== 0 || !Array.isArray(resData.data)) return;
					productListData = resData.data;

					let pcImgHtml = '';
					let mdImgHtml = '';
					let txtItemHtml = '';
					let iconItemHtml = '';

					productListData.forEach((item, index) => {
						// 【关键】严格匹配接口返回的字段名
						const nameEn = item.nameEn || '';
						const titleEn = item.titleEn || '';
						const imageUrlEn = getImageUrl(item.imageUrlEn || '');
						const itemOneEn = item.itemOneEn || '';
						const itemTwoEn = item.itemTwoEn || '';
						const itemThreeEn = item.itemThreeEn || '';
						const itemFourEn = item.itemFourEn || '';
						const itemFiveEn = item.itemFiveEn || '';
						const itemSixEn = item.itemSixEn || '';

						const displayStyle = index === 0 ? 'display: block;' : 'display: none;';

						// 图片渲染（使用英文图片地址）
						pcImgHtml += `<img class="cp-img" data-index="${index}" loading="lazy" src="${imageUrlEn}" alt="${nameEn}" style="${displayStyle}">`;
						mdImgHtml += `<img class="cp-img" data-index="${index}" loading="lazy" src="${imageUrlEn}" alt="${nameEn}" style="${displayStyle}">`;

						// 标签集合
						let labelHtml = '';
						const labelArr = [itemOneEn, itemTwoEn, itemThreeEn, itemFourEn, itemFiveEn, itemSixEn];
						labelArr.forEach(label => {
							if (label && label !== 'null') {
								labelHtml += `<span>${label}</span>`;
							}
						});

						// 文字区域
						txtItemHtml += `
                    <div class="hth_txt_item cp-txt-item" data-index="${index}" style="${displayStyle}">
                        <div class="g_tit">
                            <div class="g_tit_t">
                                <span class="">${nameEn}</span>
                                <h3 class="font-m font44">${titleEn}</h3>
                            </div>
                            <div class="g_tit_lab font20">
                                ${labelHtml}
                            </div>
                        </div>
                        <div class="g_num">
                            <div class="item">
                                <div class="item_t">
                                    <p class="font-r"> </p>
                                    <span class=""> </span>
                                </div>
                                <div class="item_b">
                                    <p> </p>
                                </div>
                            </div>
                            <div class="item">
                                <div class="item_t">
                                    <p class="font-r"> </p>
                                    <span class=""> </span>
                                </div>
                                <div class="item_b">
                                    <p> </p>
                                </div>
                            </div>
                        </div>
                    </div>
                    `;

						const jumpFunc = `goProduct(${item.id})`;
						const onClass = index === 0 ? 'item on' : 'item';

						iconItemHtml += `
                    <div class="${onClass} cp-icon-item" data-index="${index}">
                        <div class="g_svg">
                            <i>
                                ${getSvgByIndex(index)}
                            </i>
                            <p class="font20 font-m">${nameEn}</p>
                        </div>
                        <div class="txt">
                            <p class="font30">${nameEn}</p>
                            <a href="javascript:${jumpFunc}" title="${nameEn}" class="public-btn font20">
                                <p class=" font-m">Explore More</p>
                                <svg xmlns="http://www.w3.org/2000/svg" width="10.844" height="10"
                                    viewBox="0 0 10.844 10" data-inject-url="" loading="lazy">
                                    <defs>
                                        <style>
                                            .cls-1 {
                                                fill: #fff;
                                                fill-rule: evenodd;
                                            }
                                        </style>
                                    </defs>
                                    <path id="形状_1_拷贝_4--inject-18" data-name="形状 1 拷贝 4" class="cls-1"
                                        d="M207.821,577.433a1.139,1.139,0,0,1,.241-0.459,0.786,0.786,0,0,1,.513-0.24c0.059,0,.119,0,0.179,0h7.48a0.4,0.4,0,0,0-.062-0.046,1.872,1.872,0,0,1-.609-0.462q-1.008-1.089-2.019-2.177a0.9,0.9,0,0,1-.243-0.919,0.731,0.731,0,0,1,1.166-.387,1.4,1.4,0,0,1,.143.135q1.892,2.029,3.782,4.061a0.876,0.876,0,0,1,.164,1.063,1.054,1.054,0,0,1-.158.212q-1.9,2.042-3.8,4.079a0.74,0.74,0,0,1-1.169-.022,0.9,0.9,0,0,1,.006-1.061c0.041-.053.085-0.1,0.13-0.15q0.861-.925,1.723-1.849a2.634,2.634,0,0,1,.923-0.781c0-.009,0-0.019-0.008-0.029h-0.119q-3.7,0-7.4,0a0.766,0.766,0,0,1-.688-0.32,2.361,2.361,0,0,1-.174-0.4v-0.249Z"
                                        transform="translate(-207.812 -572.562)"></path>
                                </svg>
                            </a>
                        </div>
                    </div>
                    `;
					});

					// 页面渲染
					imgPcWrap.innerHTML = pcImgHtml;
					imgMdWrap.innerHTML = mdImgHtml;
					txtWrap.innerHTML = txtItemHtml;
					iconBoxWrap.innerHTML = iconItemHtml;

					bindSwitchEvent();
				}).catch(err => {
					console.error('Data load failed：', err);
				});
		}

		let currentProductIndex = 0;

		function bindSwitchEvent() {
			const iconItems = document.querySelectorAll('.cp-icon-item');
			iconItems.forEach(item => {
				item.addEventListener('mouseenter', function () {
					const index = parseInt(this.getAttribute('data-index'));
					switchToItem(index);
				});
				item.addEventListener('click', function () {
					const index = parseInt(this.getAttribute('data-index'));
					if (index === currentProductIndex) {
						goProduct(productListData[index].id);
					} else {
						switchToItem(index);
					}
				});
			});
		}

		function switchToItem(index) {
			currentProductIndex = index;
			document.querySelectorAll('.cp-icon-item').forEach((el, idx) => {
				el.classList.toggle('on', idx === index);
			});
			document.querySelectorAll('.cp-img').forEach((el, idx) => {
				el.style.display = idx === index ? 'block' : 'none';
			});
			document.querySelectorAll('.cp-txt-item').forEach((el, idx) => {
				el.style.display = idx === index ? 'block' : 'none';
			});
		}

					Group News
				</div>

				</div>

					<!-- JS动态渲染：英文新闻列表项 -->
					<ul id="news-list" style="list-style:none; padding:0; margin:0;"></ul>
				</div>

				<div
					style="width:600px; height:510px; border-radius:8px; overflow:hidden; position:relative; flex-shrink:0;">
					<!-- JS动态渲染：英文新闻图片轮播项 -->
					<div id="slider-container" style="width:100%; height:100%; position:relative;"></div>
					<div id="prev-btn"
						style="position:absolute; left:20px; top:50%; transform:translateY(-50%); width:44px; height:44px; background:rgba(0,0,0,0.4); color:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:10; font-size:20px;">
						‹</div>
					<div id="next-btn"
						style="position:absolute; right:20px; top:50%; transform:translateY(-50%); width:44px; height:44px; background:rgba(0,0,0,0.4); color:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:10; font-size:20px;">
						›</div>
				</div>

	<script>
		document.addEventListener('DOMContentLoaded', async function () {
			const res = await fetch(`${SERVER_BASE_URL}/website/news?latest=true`);
			const json = await res.json();
			console.log("✅ Get English News Data：", json);
			let newsList = json.data || [];

			// ID倒序排序
			newsList = newsList.sort((a, b) => b.id - a.id);

			// 渲染左侧英文新闻列表
			const listEl = document.getElementById("news-list");
			newsList.forEach((news, index) => {
				const li = document.createElement("li");
				li.style.cssText = "display:flex; padding:18px 0; border-bottom:1px solid #eee; cursor:pointer;";

				// 取用英文字段，日期共用date
				const enTitle = news.titleEn || "No Title";
				const enSummary = news.summaryEn;
				const enContent = news.contentEn || "";
				const showSummary = enSummary ? enSummary : (enContent.length > 50 ? enContent.substring(0, 50) + "..." : "No content");

				li.innerHTML = `
            <div style="width:70px; text-align:center; color:#c8102e; font-weight:bold;">
                <div style="font-size:16px;">${news.date.split('T')[0]}</div>
            </div>
            <div style="flex:1;">
                <h3 style="margin:0 0 5px; font-size:16px; font-weight:normal;">${enTitle}</h3>
                <p style="margin:0; font-size:14px; color:#666;">${showSummary}</p>
            </div>
        `;

				// 跳转英文详情页
				li.onclick = () => location.href = `./news-detail-en.html?id=${news.id}`;
				listEl.appendChild(li);
			});

			// 右侧轮播图渲染，使用英文标题+英文封面图
			const sliderEl = document.getElementById("slider-container");
			const items = [];
			newsList.forEach((news) => {
				const div = document.createElement("div");
				div.style.cssText = `
            position:absolute; 
            top:0; 
            left:0; 
            width:100%; 
            height:100%; 
            transition: opacity 0.8s ease;
            cursor: pointer;
        `;
				const imgUrl = getImageUrl(news.imageUrlEn || '');
				const enTitle = news.titleEn || "No Title";

				div.innerHTML = `
            <img src="${imgUrl}" style="width:100%; height:100%; object-fit:cover;">
            <div style="position:absolute; bottom:0; left:0; right:0; padding:30px 25px; background:linear-gradient(transparent, rgba(0,0,0,0.6));">
                <span style="background:#c8102e; color:#fff; padding:6px 14px; border-radius:4px; font-size:14px; margin-bottom:12px; display:inline-block;">Group News</span>
                <h3 style="font-size:22px; color:#fff; margin:0; line-height:1.4;">${enTitle}</h3>
            </div>
        `;
				div.onclick = () => location.href = `./news-detail-en.html?id=${news.id}`;
				sliderEl.appendChild(div);
				items.push(div);
			});

			// 轮播初始化
			let current = 0;
			items.forEach((it, i) => it.style.opacity = i === 0 ? 1 : 0);
			setInterval(() => {
				const next = (current + 1) % items.length;
				items[current].style.opacity = 0;
				items[next].style.opacity = 1;
				current = next;
			}, 3000);

			// 左右按钮切换
			document.getElementById('prev-btn').addEventListener('click', () => {
				let prev = (current - 1 + items.length) % items.length;
				items[current].style.opacity = 0;
				items[prev].style.opacity = 1;
				current = prev;
			});
			document.getElementById('next-btn').addEventListener('click', () => {
				let next = (current + 1) % items.length;
				items[current].style.opacity = 0;
				items[next].style.opacity = 1;
				current = next;
			});

			// 轮播点击跳转英文详情
			items.forEach((item, idx) => {
				item.onclick = () => {
					const pageNum = 4 - idx;
					location.href = `./news-${pageNum}-en.html`;
				}
			});
		});
	</script>

	<script>
		// 核心技术英文轮播全局实例
		let techEnSwiper = null;
		let autoplayTimer = null; // 兜底定时器，解决自动播放停止问题
		// 用立即执行函数包裹，防止前面的报错影响到这里
		(function () {
			'use strict';
			let scrollDataList = [];

			console.log('核心技术模块JS开始执行');

			// 页面DOM加载完成后执行所有接口请求与渲染
			document.addEventListener('DOMContentLoaded', function () {
				console.log('DOM加载完成，开始请求接口');

				// 接口1：加载核心技术图文 + 参数（驼峰字段，和后端完全匹配）
				const techApiUrl = `${SERVER_BASE_URL}/website/techMain`;
				fetch(techApiUrl)
					.then(res => res.json())
					.then(resData => {
						console.log('核心技术接口返回:', resData);
						if (resData && resData.code === 0 && Array.isArray(resData.data) && resData.data.length > 0) {
							const data = resData.data[0];
							console.log('核心技术第一条数据:', data);

							// 左侧 无线自组网（驼峰字段）
							const titleLeftTextEl = document.getElementById('titleLeftText');
							if (titleLeftTextEl) {
								titleLeftTextEl.innerText = data.titleLeftEn || 'Ad-hoc Network Tech Params';
								console.log('左侧标题赋值:', titleLeftTextEl.innerText);
							}

							const imgLeftXsEl = document.getElementById('imgLeftXs');
							const imgLeftYcEl = document.getElementById('imgLeftYc');
							if (imgLeftXsEl && imgLeftYcEl) {
								const leftImgUrl = getImageUrl(data.imageUrlLeftEn || data.imageUrlLeft || '');
								imgLeftXsEl.src = leftImgUrl;
								imgLeftYcEl.src = leftImgUrl;
								console.log('左侧图片地址:', leftImgUrl);
							}

							// 右侧 无电制冷标题+图片（驼峰字段）
							const titleRightTextEl = document.getElementById('titleRightText');
							if (titleRightTextEl) {
								titleRightTextEl.innerText = data.titleEn || 'Power‑Free Cooling Tech Params';
								console.log('右侧标题赋值:', titleRightTextEl.innerText);
							}

							const imgRightXsEl = document.getElementById('imgRightXs');
							const imgRightYcEl = document.getElementById('imgRightYc');
							if (imgRightXsEl && imgRightYcEl) {
								const rightImgUrl = getImageUrl(data.imageUrlEn || data.imageUrl || '');
								imgRightXsEl.src = rightImgUrl;
								imgRightYcEl.src = rightImgUrl;
								console.log('右侧图片地址:', rightImgUrl);
							}

							// 动态渲染技术参数列表（驼峰字段）
							const wrap = document.getElementById('techItemWrap');
							if (wrap) {
								let itemHtml = '';
								const paramList = [
									{ label: data.itemOneEn, value: data.itemOneValueEn },
									{ label: data.itemTwoEn, value: data.itemTwoValueEn },
									{ label: data.itemThreeEn, value: data.itemThreeValueEn },
									{ label: data.itemFourEn, value: data.itemFourValueEn },
									{ label: data.itemFiveEn, value: data.itemFiveValueEn },
									{ label: data.itemSixEn, value: data.itemSixValueEn }
								];
								console.log('技术参数列表:', paramList);
								paramList.forEach(item => {
									if (item.label && item.value) {
										itemHtml += `
                                    <div class="txt_p font24">
                                        <p>${item.label}<span class="">${item.value}</span></p>
                                    </div>
                                `;
									}
								});
								wrap.innerHTML = itemHtml;
								console.log('技术参数渲染完成, HTML:', itemHtml);
							}
						}
					})
					.catch(err => {
						console.error('核心技术接口请求失败:', err);
					});

				// 接口2：加载轮播数据并循环渲染轮播项（驼峰字段，和后端完全匹配）
				const scrollApiUrl = `${SERVER_BASE_URL}/website/techScrolling`;
				fetch(scrollApiUrl)
					.then(res => res.json())
					.then(resData => {
						console.log('轮播接口返回:', resData);
						if (resData && resData.code === 0 && Array.isArray(resData.data)) {
							scrollDataList = resData.data;
							console.log('轮播数据列表:', scrollDataList);
							const wrapper = document.getElementById('swiperWrapper');
							if (!wrapper) return;

							let slideHtml = '';
							// 循环生成每一个轮播slide
							scrollDataList.forEach((item, index) => {
								const delay = (0.2 + index * 0.1).toFixed(1);
								slideHtml += `
                            <div class="swiper-slide" style="width: 444px; margin-right:20px;">
                                <div class="item wow fadeInUp" style="visibility:visible; animation-delay:${delay}s;">
                                    <div class="public-img"
                                        style="width:100%; height:auto; overflow:hidden; position:relative; z-index:999;">
                                        <a href="${item.hrefToEn || '#'}" target="_blank"
                                            style="display:block; width:100%; cursor:pointer !important; pointer-events:auto !important;">
                                            <img loading="lazy" src="${getImageUrl(item.imageUrlEn || '')}"
                                                alt="${item.titleEn || ''}"

                                        </a>
                                    </div>
                                    <div class="txt" style="text-align:center; margin-top:10px;">
                                        <h3 class="font-b font26"
                                            style="color:#fff; display:block !important; visibility:visible !important;">

                                        </h3>
                                        <p></p>
                                    </div>
                                </div>
                            </div>
                        `;
							});

							wrapper.innerHTML = slideHtml;
							console.log('轮播HTML渲染完成:', slideHtml);
							// 调用【核心技术英文专属初始化】
							initTechEnSwiper();
						}
					})
					.catch(err => {
						console.error('轮播接口请求失败:', err);
					});
			});

			// ========== 核心技术英文版独立Swiper初始化 【重点重构】 ==========
			function initTechEnSwiper() {
				console.log('开始初始化英文核心技术Swiper');
				// 先销毁旧实例+清空旧定时器
				if (techEnSwiper) techEnSwiper.destroy(true, true);
				if (autoplayTimer) clearInterval(autoplayTimer);

				setTimeout(function () {
					if (typeof Swiper === 'undefined') {
						console.error('Swiper is not loaded');
						return;
					}
					// 数据少于2条关闭循环，避免卡死
					const canLoop = scrollDataList.length >= 2;

					techEnSwiper = new Swiper('.swiper-tech-en', {
						allowTouchMove: true,
						touchAngle: 30,
						grabCursor: true,
						watchSlidesVisibility: true,

						autoplay: {
							delay: 3000,
							disableOnInteraction: false,
							pauseOnMouseEnter: false,
						},
						speed: 1000,
						loop: canLoop,
						// 移除冲突参数 loopAdditionalSlides
						slidesPerView: 3, // 固定一屏3张，彻底解决auto模式循环bug
						spaceBetween: 20,
						centeredSlides: false,
						freeMode: false,
						watchOverflow: false,

						pagination: {
							el: '.swip2_pag',
							clickable: true,
						}
					});

					console.log('英文核心Swiper初始化完成:', techEnSwiper);

					// 兜底定时器：强制持续轮播，解决原生autoplay停止问题
					autoplayTimer = setInterval(() => {
						if (techEnSwiper && !document.hidden) {
							techEnSwiper.slideNext();
						}
					}, 3000);
				}, 300);
			}

			// 窗口缩放刷新轮播
			window.addEventListener('resize', () => {
				if (techEnSwiper) {
					techEnSwiper.update();
				}
			});

			// 页面切回可视状态，恢复轮播
			document.addEventListener('visibilitychange', () => {
				if (!document.hidden && techEnSwiper) {
					techEnSwiper.autoplay.start();
				}
			});

			// 页面卸载清除定时器，防止内存泄漏
			window.addEventListener('beforeunload', () => {
				if (autoplayTimer) clearInterval(autoplayTimer);
			})
		})();
	</script>

	<script type="text/javascript">
			(function () {
				var tab_tit = document.getElementById('think_page_trace_tab_tit').getElementsByTagName('span');
				var tab_cont = document.getElementById('think_page_trace_tab_cont').getElementsByTagName('div');
				var open = document.getElementById('think_page_trace_open');
				var close = document.getElementById('think_page_trace_close').children[0];
				var trace = document.getElementById('think_page_trace_tab');
				var cookie = document.cookie.match(/thinkphp_show_page_trace=(\d\|\d)/);
				var history = (cookie && typeof cookie[1] != 'undefined' && cookie[1].split('|')) || [0, 0];
				open.onclick = function () {
					trace.style.display = 'block';
					this.style.display = 'none';
					close.parentNode.style.display = 'block';
					history[0] = 1;
					document.cookie = 'thinkphp_show_page_trace=' + history.join('|')
				}
				close.onclick = function () {
					trace.style.display = 'none';
					this.parentNode.style.display = 'none';
					open.style.display = 'block';
					history[0] = 0;
					document.cookie = 'thinkphp_show_page_trace=' + history.join('|')
				}
				for (var i = 0; i < tab_tit.length; i++) {
					tab_tit[i].onclick = (function (i) {
						return function () {
							for (var j = 0; j < tab_cont.length; j++) {
								tab_cont[j].style.display = 'none';
								tab_tit[j].style.color = '#999';
							}
							tab_cont[i].style.display = 'block';
							tab_tit[i].style.color = '#000';
							history[1] = i;
							document.cookie = 'thinkphp_show_page_trace=' + history.join('|')
						}
					})(i)
				}
				parseInt(history[0]) && open.click();
				tab_tit[history[1]].click();
			})();
	</script>

	<script>
        window.addEventListener('load', function() {
            var gpop = document.getElementById('fixedGpop');
            if (gpop) {
                gpop.style.display = 'block';
                gpop.style.visibility = 'visible';
                gpop.style.opacity = '1';
            }

            $('.pop_a').hover(function(){
                $(this).addClass('on');
            }, function(){
                $(this).removeClass('on');
            });
        });

        document.addEventListener('click', function(e) {
            var target = e.target.closest('.pop_a.cur2');
            if (target) {
                e.preventDefault();
                e.stopPropagation();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        });

        window.addEventListener('scroll', function(event) {
            var gpop = document.getElementById('fixedGpop');
            if (gpop) {
                gpop.style.display = 'block';
                gpop.style.visibility = 'visible';
                gpop.style.opacity = '1';
            }
        }, true);

        document.addEventListener('wheel', function(e) {
            if (!e.target.closest('.gpop') && !e.target.closest('.new-nav-wrap')) {
                var delta = e.deltaY || e.detail || e.wheelDelta;
                window.scrollBy(0, delta);
            }
        }, { passive: true });
    </script>
