    <script>
        document.addEventListener('DOMContentLoaded', async function () {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const newsId = urlParams.get('id');
                
                if (!newsId) {
                    document.getElementById('article-box').innerHTML = '<p class="article-text">参数错误：缺少新闻ID</p>';
                    return;
                }

                console.log("🚀 开始加载新闻详情，ID:", newsId);
                const res = await fetch(`${SERVER_BASE_URL}/website/news`);
                const json = await res.json();
                console.log("✅ 接口返回:", json);
                
                let list = json.data || [];
                let news = list.find(item => String(item.id) === String(newsId));

                if (!news) {
                    document.getElementById('article-box').innerHTML = '<p class="article-text">文章不存在或已删除</p>';
                    return;
                }

                console.log("✅ 新闻数据:", news);
                console.log("✅ 字段列表:", Object.keys(news));

                const title = news.title || '';
                const date = news.date || '';
                const summary = news.summary || '';
                const content = news.content || '';

                const imgUrl = news.image_url || news.imageUrl || '';
                const displayImgUrl = getImageUrl(imgUrl);

                const picFieldList = [
                    { field: 'contentUrlOne', altField: 'content_url_one' },
                    { field: 'contentUrlTwo', altField: 'content_url_two' },
                    { field: 'contentUrlThree', altField: 'content_url_three' },
                    { field: 'contentUrl4', altField: 'content_url_4' },
                    { field: 'contentUrl5', altField: 'content_url_5' },
                    { field: 'contentUrl6', altField: 'content_url_6' },
                    { field: 'contentUrl7', altField: 'content_url_7' },
                    { field: 'contentUrl8', altField: 'content_url_8' },
                    { field: 'contentUrl9', altField: 'content_url_9' },
                    { field: 'contentUrl10', altField: 'content_url_10' }
                ];
                
                const paraPicMap = {};
                let hasContentImg = false;
                let picIndex = 1;

                picFieldList.forEach(item => {
                    const picPath = news[item.altField] || news[item.field];
                    if (picPath && picPath.trim()) {
                        const displayPicPath = getImageUrl(picPath);
                        const match = picPath.match(/-(\d+)\./);
                        let paraNum;
                        if (match && match[1]) {
                            paraNum = parseInt(match[1], 10);
                        } else {
                            paraNum = picIndex++;
                        }
                        paraPicMap[paraNum] = `<img class="article-img" src="${displayPicPath}" alt="" loading="lazy">`;
                        hasContentImg = true;
                    }
                });

                const formatDate = date.split('T')[0];
                
                let topImgHtml = '';
                if (displayImgUrl && !hasContentImg) {
                    topImgHtml = `<img class="article-img" src="${displayImgUrl}" alt="${title}" loading="lazy">`;
                }

                let summaryHtml = '';
                if (summary) {
                    summaryHtml = `<div class="article-desc">${summary}</div>`;
                }

                const rawParagraphs = content.split(/\n+/).filter(p => p.trim() !== '');
                let renderHtml = '';

                rawParagraphs.forEach((p, index) => {
                    let text = p.trim();
                    text = "　　" + text;
                    const titleReg = /^　　(([一二三四五六七八九十]+、)|(\d+\.)|(\（\d+\）)).+/;
                    if (titleReg.test(text)) {
                        text = `<strong>${text}</strong>`;
                    }
                    renderHtml += `<p class="article-text">${text}</p>`;
                    const curParaNum = index + 1;
                    if (paraPicMap[curParaNum]) {
                        renderHtml += paraPicMap[curParaNum];
                    }
                });

                const html = `
                    <div class="article-title-top" style="text-align:center;">${title}</div>
                    <div class="article-date">${formatDate}</div>
                    ${topImgHtml}
                    ${summaryHtml}
                    ${renderHtml}
                `;

                document.getElementById('article-box').innerHTML = html;
                console.log("✅ 页面渲染完成");

            } catch (err) {
                console.error('加载文章失败', err);
                document.getElementById('article-box').innerHTML = '<p class="article-text">文章加载失败，请稍后重试</p>';
            }
        });
    </script>
