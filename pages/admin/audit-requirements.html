<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>需求审核 - 黑科技商城管理后台</title>
    <link rel="stylesheet" type="text/css" href="../../index_files/g-style.css">
    <script src="../../config1.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
            color: #333; background: #f0f2f5;
            -webkit-font-smoothing: antialiased; min-height: 100vh;
        }
        a { text-decoration: none; color: inherit; }
        ul, ol { list-style: none; }

        /* ===== 顶部导航条 ===== */
        .top-bar {
            background: linear-gradient(135deg, #1a1f2e 0%, #2c3e50 100%);
            color: #fff;
            position: sticky; top: 0; z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .top-bar-inner {
            max-width: 1200px; margin: 0 auto; padding: 14px 24px;
            display: flex; align-items: center; gap: 16px;
        }
        .back-btn {
            display: flex; align-items: center; gap: 4px;
            color: #fff; font-size: 14px; font-weight: 500;
            cursor: pointer; padding: 6px 12px; border-radius: 4px;
            transition: background 0.2s;
        }
        .back-btn:hover { background: rgba(255,255,255,0.1); }
        .page-title {
            flex: 1; text-align: center; font-size: 17px; font-weight: bold;
            letter-spacing: 1px;
        }
        .page-title .admin-badge {
            display: inline-block; padding: 2px 8px; margin-left: 8px;
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            border-radius: 4px; font-size: 11px; font-weight: 500;
            vertical-align: middle;
        }
        .header-logo { display: flex; align-items: center; gap: 8px; }
        .header-logo .logo-icon { width: 36px; height: 36px; object-fit: contain; border-radius: 6px; background: #fff; padding: 2px; }
        .header-logo .logo-text { font-size: 16px; font-weight: bold; }
        .header-logo .logo-text .highlight { color: #ffd700; }

        /* ===== 主体容器 ===== */
        .container { max-width: 1200px; margin: 0 auto; padding: 24px 24px 60px; }

        /* ===== 统计卡片 ===== */
        .stats-row {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: #fff; border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            padding: 16px 18px; cursor: pointer;
            transition: all 0.2s; border-left: 4px solid #0a4db4;
        }
        .stat-card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.1); }
        .stat-card.active {
            background: linear-gradient(135deg, #0a4db4 0%, #1e6fd9 100%);
            color: #fff;
        }
        .stat-card.active .stat-num,
        .stat-card.active .stat-label { color: #fff; }
        .stat-card.pending  { border-left-color: #faad14; }
        .stat-card.approved { border-left-color: #52c41a; }
        .stat-card.rejected { border-left-color: #ff4d4f; }
        .stat-card.pending.active  { background: linear-gradient(135deg, #faad14 0%, #d48806 100%); }
        .stat-card.approved.active { background: linear-gradient(135deg, #52c41a 0%, #389e0d 100%); }
        .stat-card.rejected.active { background: linear-gradient(135deg, #ff4d4f 0%, #cf1322 100%); }
        .stat-card .stat-num { font-size: 24px; font-weight: bold; color: #333; }
        .stat-card .stat-label { font-size: 13px; color: #999; margin-top: 4px; }

        /* ===== 筛选栏 ===== */
        .filter-bar {
            background: #fff; border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            padding: 14px 18px; margin-bottom: 20px;
            display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
        }
        .filter-group { display: flex; align-items: center; gap: 8px; }
        .filter-group label { font-size: 13px; color: #666; }
        .filter-group select,
        .filter-group input {
            padding: 6px 10px; font-size: 13px;
            border: 1px solid #d9e0ea; border-radius: 6px;
            background: #fafbfc; color: #333;
        }
        .filter-group select:focus,
        .filter-group input:focus {
            outline: none; border-color: #0a4db4; background: #fff;
        }
        .filter-group .btn-search,
        .filter-group .btn-reset {
            padding: 6px 14px; font-size: 13px; cursor: pointer;
            border: none; border-radius: 6px; transition: all 0.2s;
        }
        .btn-search {
            background: linear-gradient(135deg, #0a4db4, #1e6fd9);
            color: #fff;
        }
        .btn-search:hover { transform: translateY(-1px); box-shadow: 0 3px 8px rgba(10,77,180,0.3); }
        .btn-reset {
            background: #f5f5f5; color: #666; border: 1px solid #d9e0ea;
        }
        .btn-reset:hover { background: #e8e8e8; }

        /* ===== 列表 ===== */
        .req-list { display: flex; flex-direction: column; gap: 12px; }
        .req-card {
            background: #fff; border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            overflow: hidden; transition: all 0.2s;
            border-left: 4px solid #d9e0ea;
        }
        .req-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.1); }
        .req-card.status-pending  { border-left-color: #faad14; }
        .req-card.status-approved { border-left-color: #52c41a; }
        .req-card.status-rejected { border-left-color: #ff4d4f; }

        .req-main {
            padding: 18px 22px;
        }
        .req-head {
            display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap;
        }
        .req-id { font-size: 12px; color: #999; }
        .req-type-tag {
            display: inline-block; padding: 2px 8px; border-radius: 4px;
            font-size: 12px; font-weight: 500;
        }
        .req-type-tag.buy  { background: #fff1f0; color: #cf1322; }
        .req-type-tag.sell { background: #f6ffed; color: #389e0d; }
        .req-type-tag.coop { background: #e6f7ff; color: #096dd9; }
        .req-status-tag {
            display: inline-block; padding: 2px 8px; border-radius: 4px;
            font-size: 12px; font-weight: 500; margin-left: auto;
        }
        .req-status-tag.pending  { background: #fff7e6; color: #d48806; }
        .req-status-tag.approved { background: #f6ffed; color: #389e0d; }
        .req-status-tag.rejected { background: #fff1f0; color: #cf1322; }
        .req-title {
            font-size: 16px; font-weight: bold; color: #333;
            margin-bottom: 8px; word-break: break-all;
        }
        .req-meta {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 8px 16px; font-size: 13px; color: #666;
            margin-bottom: 10px;
        }
        .req-meta .meta-row { display: flex; gap: 6px; align-items: center; }
        .req-meta .meta-label { color: #999; min-width: 60px; }
        .req-meta .meta-value { color: #333; word-break: break-all; }
        .req-meta .meta-value.price { color: #ff4d4f; font-weight: 500; }
        .req-remark {
            margin-top: 8px; padding: 8px 12px;
            border-radius: 6px; font-size: 13px;
        }
        .req-remark.rejected { background: #fff1f0; color: #cf1322; }
        .req-remark.approved { background: #f6ffed; color: #389e0d; }
        .req-remark .label { font-weight: bold; margin-right: 4px; }

        /* ===== 操作按钮区 ===== */
        .req-actions {
            display: flex; gap: 8px; padding: 12px 22px;
            background: #fafbfc; border-top: 1px solid #f0f3f7;
            flex-wrap: wrap;
        }
        .action-btn {
            padding: 8px 18px; font-size: 13px; font-weight: 500;
            border: none; border-radius: 6px; cursor: pointer;
            transition: all 0.2s; display: inline-flex; align-items: center; gap: 4px;
        }
        .btn-view {
            background: #fff; color: #0a4db4;
            border: 1px solid #0a4db4;
        }
        .btn-view:hover { background: #e8f0fe; }
        .btn-approve {
            background: linear-gradient(135deg, #52c41a, #389e0d);
            color: #fff;
        }
        .btn-approve:hover { transform: translateY(-1px); box-shadow: 0 3px 8px rgba(82,196,26,0.3); }
        .btn-reject {
            background: linear-gradient(135deg, #ff4d4f, #cf1322);
            color: #fff;
        }
        .btn-reject:hover { transform: translateY(-1px); box-shadow: 0 3px 8px rgba(255,77,79,0.3); }
        .btn-disabled {
            background: #f5f5f5; color: #bbb; cursor: not-allowed;
            border: 1px solid #e0e0e0;
        }

        /* ===== 详情/驳回弹窗 ===== */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.5);
            display: none; align-items: center; justify-content: center;
            z-index: 9999; padding: 20px;
        }
        .modal-overlay.show { display: flex; }
        .modal-box {
            background: #fff; border-radius: 12px;
            max-width: 600px; width: 100%; max-height: 80vh;
            display: flex; flex-direction: column;
            animation: popIn 0.25s ease-out;
        }
        @keyframes popIn {
            from { transform: scale(0.92); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .modal-head {
            padding: 16px 24px; border-bottom: 1px solid #f0f3f7;
            display: flex; align-items: center; justify-content: space-between;
        }
        .modal-head h3 { font-size: 16px; color: #333; }
        .modal-close {
            width: 28px; height: 28px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            border: none; background: transparent; font-size: 18px;
            color: #999; border-radius: 4px;
        }
        .modal-close:hover { background: #f5f5f5; color: #333; }
        .modal-body {
            padding: 20px 24px; overflow-y: auto; flex: 1;
        }
        .modal-body .detail-row {
            display: flex; padding: 10px 0;
            border-bottom: 1px dashed #f0f3f7;
        }
        .modal-body .detail-row:last-child { border-bottom: none; }
        .modal-body .detail-label { width: 110px; color: #999; flex-shrink: 0; }
        .modal-body .detail-value { flex: 1; color: #333; word-break: break-all; }
        .modal-body .file-link {
            display: block; padding: 8px 12px; margin-bottom: 6px;
            background: #f0f5ff; border-radius: 6px;
            color: #0a4db4; font-size: 13px;
            transition: all 0.2s;
        }
        .modal-body .file-link:hover { background: #e0eaff; }
        .modal-foot {
            padding: 14px 24px; border-top: 1px solid #f0f3f7;
            display: flex; justify-content: flex-end; gap: 8px;
        }
        .modal-foot .btn {
            padding: 8px 18px; font-size: 13px; font-weight: 500;
            border: none; border-radius: 6px; cursor: pointer;
            transition: all 0.2s;
        }
        .btn-cancel { background: #f5f5f5; color: #666; }
        .btn-cancel:hover { background: #e8e8e8; }
        .btn-confirm {
            background: linear-gradient(135deg, #ff4d4f, #cf1322);
            color: #fff;
        }
        .btn-confirm:hover { transform: translateY(-1px); box-shadow: 0 3px 8px rgba(255,77,79,0.3); }
        .reject-reason {
            width: 100%; min-height: 90px; padding: 10px 12px;
            border: 1px solid #d9e0ea; border-radius: 6px;
            font-size: 14px; font-family: inherit;
            resize: vertical; background: #fafbfc;
        }
        .reject-reason:focus { outline: none; border-color: #ff4d4f; background: #fff; }

        /* ===== 空状态/加载/错误 ===== */
        .empty-state {
            text-align: center; padding: 80px 20px; color: #999;
        }
        .empty-state .empty-icon { font-size: 56px; margin-bottom: 16px; }
        .empty-state h3 { font-size: 18px; color: #666; margin-bottom: 8px; }
        .empty-state p { font-size: 14px; }
        .loading, .error-box {
            text-align: center; padding: 60px; color: #999; font-size: 14px;
        }
        .error-box { color: #cf1322; }

        /* ===== 分页 ===== */
        .pagination { display: flex; justify-content: center; gap: 6px; margin-top: 24px; }
        .pagination button {
            padding: 6px 12px; min-width: 32px;
            border: 1px solid #d9e0ea; background: #fff;
            border-radius: 6px; cursor: pointer; font-size: 14px;
            color: #333; transition: all 0.2s;
        }
        .pagination button:hover:not(:disabled) { border-color: #0a4db4; color: #0a4db4; }
        .pagination button.active {
            background: linear-gradient(135deg, #0a4db4, #1e6fd9);
            color: #fff; border-color: transparent;
        }
        .pagination button:disabled { cursor: not-allowed; opacity: 0.5; }

        /* ===== Toast 提示 ===== */
        .toast {
            position: fixed; top: 80px; left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px; border-radius: 8px;
            font-size: 14px; z-index: 10000;
            opacity: 0; transition: opacity 0.3s, top 0.3s;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }
        .toast.show { opacity: 1; top: 100px; }
        .toast.success { background: #f6ffed; color: #389e0d; border: 1px solid #b7eb8f; }
        .toast.error { background: #fff1f0; color: #cf1322; border: 1px solid #ffa39e; }

        @media (max-width: 768px) {
            .container { padding: 16px 12px 40px; }
            .stats-row { grid-template-columns: repeat(2, 1fr); }
            .req-meta { grid-template-columns: 1fr; }
            .page-title { font-size: 14px; }
        }
    </style>
</head>
<body>

<!-- ============ 顶部导航 ============ -->
<div class="top-bar">
    <div class="top-bar-inner">
        <div class="back-btn" onclick="goBack()">◀ 返回</div>
        <div class="page-title">需求审核管理<span class="admin-badge">ADMIN</span></div>
        <a href="inquiry-quote.html" class="back-btn" style="background:rgba(255,215,0,0.15);color:#ffd700;">💬 询价报价</a>
        <div class="header-logo">
            <div class="logo-text">HARVEST · 黑科技商城</div>
        </div>
    </div>
</div>

<!-- ============ 主体 ============ -->
<div class="container">

    <!-- 统计卡片 -->
    <div class="stats-row">
        <div class="stat-card active" id="stat-all" onclick="switchStatus('')">
            <div class="stat-num" id="num-all">-</div>
            <div class="stat-label">全部需求</div>
        </div>
        <div class="stat-card pending" id="stat-pending" onclick="switchStatus('pending')">
            <div class="stat-num" id="num-pending">-</div>
            <div class="stat-label">待审核</div>
        </div>
        <div class="stat-card approved" id="stat-approved" onclick="switchStatus('approved')">
            <div class="stat-num" id="num-approved">-</div>
            <div class="stat-label">已通过</div>
        </div>
        <div class="stat-card rejected" id="stat-rejected" onclick="switchStatus('rejected')">
            <div class="stat-num" id="num-rejected">-</div>
            <div class="stat-label">已驳回</div>
        </div>
    </div>

    <!-- 筛选栏 -->
    <div class="filter-bar">
        <div class="filter-group">
            <label>类型：</label>
            <select id="filterType">
                <option value="">全部</option>
                <option value="buy">🛒 我要买</option>
                <option value="sell">📦 我要卖</option>
                <option value="coop">🤝 我要合作</option>
            </select>
        </div>
        <div class="filter-group">
            <label>品类：</label>
            <select id="filterCategory">
                <option value="">全部</option>
                <option value="1">人工智能和机器人</option>
                <option value="2">前沿新材料</option>
                <option value="3">数字服务与平台</option>
                <option value="4">通信与网络</option>
                <option value="5">低空经济</option>
                <option value="6">大宗贸易</option>
                <option value="7">文化创意与IP</option>
                <option value="8">智慧农业与粮储</option>
                <option value="9">安防与识别</option>
                <option value="10">新能源与储能</option>
            </select>
        </div>
        <div class="filter-group">
            <label>搜索：</label>
            <input type="text" id="filterKeyword" placeholder="名称/联系人/手机号/用户名" onkeyup="if(event.key==='Enter')doSearch()">
            <button class="btn-search" onclick="doSearch()">搜索</button>
            <button class="btn-reset" onclick="doReset()">重置</button>
        </div>
    </div>

    <!-- 列表 -->
    <div id="listBox">
        <div class="loading">加载中...</div>
    </div>

    <!-- 分页 -->
    <div class="pagination" id="pagination" style="display:none;"></div>
</div>

<!-- ============ 详情弹窗 ============ -->
<div class="modal-overlay" id="detailModal">
    <div class="modal-box">
        <div class="modal-head">
            <h3>需求详情</h3>
            <button class="modal-close" onclick="closeModal('detailModal')">×</button>
        </div>
        <div class="modal-body" id="detailBody"></div>
        <div class="modal-foot">
            <button class="btn btn-cancel" onclick="closeModal('detailModal')">关闭</button>
        </div>
    </div>
</div>

<!-- ============ 驳回原因弹窗 ============ -->
<div class="modal-overlay" id="rejectModal">
    <div class="modal-box" style="max-width: 480px;">
        <div class="modal-head">
            <h3>驳回需求</h3>
            <button class="modal-close" onclick="closeModal('rejectModal')">×</button>
        </div>
        <div class="modal-body">
            <p style="margin-bottom: 10px; color: #666; font-size: 13px;">
                请填写驳回原因（必填，将展示给发布者）：
            </p>
            <textarea class="reject-reason" id="rejectReason" placeholder="例如：技术指标文件不完整，请补充产品检测报告..."></textarea>
        </div>
        <div class="modal-foot">
            <button class="btn btn-cancel" onclick="closeModal('rejectModal')">取消</button>
            <button class="btn btn-confirm" onclick="confirmReject()">确认驳回</button>
        </div>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
const API_BASE = window.SERVER_BASE_URL || '';
let currentStatus = '';
let currentPage = 1;
let pendingRejectId = null; // 当前待驳回的需求 ID
const PAGE_SIZE = 10;

const CATEGORY_MAP = {
    1: '人工智能和机器人', 2: '前沿新材料', 3: '数字服务与平台',
    4: '通信与网络', 5: '低空经济', 6: '大宗贸易',
    7: '文化创意与IP', 8: '智慧农业与粮储', 9: '安防与识别', 10: '新能源与储能'
};
const TYPE_MAP = { buy: '我要买', sell: '我要卖', coop: '我要合作' };

/* ============ 登录 + 管理员校验 ============ */
function ensureAdmin() {
    const token = localStorage.getItem('token');
    if (!token || checkTokenExpired()) {
        const cur = window.location.pathname.replace(/^\//, '') + (window.location.search || '');
        window.location.href = '../user/login.html?redirect=' + encodeURIComponent(cur);
        return false;
    }
    // 校验 JWT 中的 roleId 必须为 1（管理员）
    const roleId = parseJwtRoleId(token);
    if (roleId !== 1) {
        document.body.innerHTML = `
            <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;color:#999;">
                <div style="font-size:64px;margin-bottom:16px;">🔒</div>
                <h2 style="font-size:18px;color:#666;margin-bottom:8px;">无访问权限</h2>
                <p style="font-size:14px;margin-bottom:16px;">本页面仅管理员可访问</p>
                <a href="../../index.html" style="padding:10px 24px;background:#0a4db4;color:#fff;border-radius:8px;font-size:14px;">返回首页</a>
            </div>
        `;
        return false;
    }
    return true;
}

function parseJwtRoleId(token) {
    try {
        const parts = token.split('.');
        if (parts.length !== 3) return null;
        const payload = JSON.parse(atob(parts[1].replace(/-/g, '+').replace(/_/g, '/')));
        const claims = payload.claims || payload;
        return claims.roleId ? Number(claims.roleId) : null;
    } catch (e) {
        return null;
    }
}

/* ============ 切换状态筛选 ============ */
function switchStatus(s) {
    currentStatus = s;
    currentPage = 1;
    document.querySelectorAll('.stat-card').forEach(c => c.classList.remove('active'));
    const id = s ? `stat-${s}` : 'stat-all';
    document.getElementById(id).classList.add('active');
    loadList();
}

/* ============ 搜索/重置 ============ */
function doSearch() {
    currentPage = 1;
    loadList();
}
function doReset() {
    document.getElementById('filterType').value = '';
    document.getElementById('filterCategory').value = '';
    document.getElementById('filterKeyword').value = '';
    currentStatus = '';
    currentPage = 1;
    document.querySelectorAll('.stat-card').forEach(c => c.classList.remove('active'));
    document.getElementById('stat-all').classList.add('active');
    loadList();
}

/* ============ 加载列表 ============ */
async function loadList() {
    const box = document.getElementById('listBox');
    box.innerHTML = '<div class="loading">加载中...</div>';
    document.getElementById('pagination').style.display = 'none';

    const params = new URLSearchParams({
        pageNum: currentPage, pageSize: PAGE_SIZE
    });
    if (currentStatus)   params.set('status', currentStatus);
    const t = document.getElementById('filterType').value;
    if (t) params.set('type', t);
    const c = document.getElementById('filterCategory').value;
    if (c) params.set('categoryId', c);
    const k = document.getElementById('filterKeyword').value.trim();
    if (k) params.set('keyword', k);

    try {
        const resp = await fetch(`${API_BASE}/requirement/admin/list?${params}`, {
            headers: { 'Authorization': localStorage.getItem('token') }
        });
        if (resp.status === 401) {
            const cur = window.location.pathname.replace(/^\//, '') + (window.location.search || '');
            window.location.href = '../user/login.html?redirect=' + encodeURIComponent(cur);
            return;
        }
        const result = await resp.json();
        if (resp.ok && result.code === 0) {
            renderList(result.data);
            loadStats(); // 加载统计（异步）
        } else if (result.message && result.message.indexOf('无权') !== -1) {
            box.innerHTML = `<div class="error-box">${escapeHtml(result.message)}</div>`;
        } else {
            box.innerHTML = `<div class="error-box">${escapeHtml(result.message || result.msg || '加载失败')}</div>`;
        }
    } catch (err) {
        console.error('加载错误:', err);
        box.innerHTML = '<div class="error-box">网络错误，请稍后重试</div>';
    }
}

/* ============ 加载统计数字（按4个状态分别请求一次总数） ============ */
async function loadStats() {
    // 通过分别请求各状态的第1页拿 total
    const stats = [
        { key: 'all',      status: '' },
        { key: 'pending',  status: 'pending' },
        { key: 'approved', status: 'approved' },
        { key: 'rejected', status: 'rejected' }
    ];
    for (const s of stats) {
        const params = new URLSearchParams({ pageNum: 1, pageSize: 1 });
        if (s.status) params.set('status', s.status);
        try {
            const r = await fetch(`${API_BASE}/requirement/admin/list?${params}`, {
                headers: { 'Authorization': localStorage.getItem('token') }
            });
            const j = await r.json();
            if (r.ok && j.code === 0 && j.data) {
                document.getElementById(`num-${s.key}`).textContent = j.data.total;
            }
        } catch (e) { /* ignore */ }
    }
}

/* ============ 渲染列表 ============ */
function renderList(page) {
    const box = document.getElementById('listBox');
    const items = page.items || [];
    const total = page.total || 0;

    if (!items.length) {
        box.innerHTML = `
            <div class="empty-state">
                <div class="empty-icon">📋</div>
                <h3>暂无符合条件的需求数据</h3>
                <p>试试切换状态或调整筛选条件</p>
            </div>
        `;
        return;
    }

    box.innerHTML = `<div class="req-list">${items.map(renderCard).join('')}</div>`;
    renderPagination(total);
}

function renderCard(r) {
    const typeTag = `<span class="req-type-tag ${r.type}">${TYPE_MAP[r.type] || r.type}</span>`;
    const statusTag = `<span class="req-status-tag ${r.status}">${statusText(r.status)}</span>`;
    const cat = CATEGORY_MAP[r.categoryId] || `品类#${r.categoryId}`;
    const price = (r.minPrice != null || r.maxPrice != null)
        ? `¥${r.minPrice || 0} ~ ¥${r.maxPrice || '面议'}`
        : '价格面议';
    const ecee = r.needEcee === 1 ? '需要' : '不需要';

    let remarkHtml = '';
    if (r.auditRemark) {
        const cls = r.status === 'approved' ? 'approved' : 'rejected';
        const label = r.status === 'approved' ? '审核备注' : '驳回原因';
        remarkHtml = `
            <div class="req-remark ${cls}">
                <span class="label">${label}：</span>${escapeHtml(r.auditRemark)}
            </div>
        `;
    }

    // 待审核：显示通过+驳回；其它状态：仅显示查看详情
    const isPending = r.status === 'pending';
    const actions = `
        <button class="action-btn btn-view" onclick="viewDetail(${r.id})">👁 查看详情</button>
        ${isPending ? `
            <button class="action-btn btn-approve" onclick="approve(${r.id})">✓ 通过</button>
            <button class="action-btn btn-reject" onclick="openReject(${r.id})">✕ 驳回</button>
        ` : ''}
    `;

    return `
        <div class="req-card status-${r.status}">
            <div class="req-main">
                <div class="req-head">
                    <span class="req-id">#${r.id}</span>
                    ${typeTag}
                    <span style="font-size:12px;color:#999;">${escapeHtml(cat)}</span>
                    ${statusTag}
                </div>
                <div class="req-title">${escapeHtml(r.name)}</div>
                <div class="req-meta">
                    <div class="meta-row"><span class="meta-label">发布者：</span><span class="meta-value">${escapeHtml(r.username || '-')}</span></div>
                    <div class="meta-row"><span class="meta-label">联系人：</span><span class="meta-value">${escapeHtml(r.contactName || '-')}</span></div>
                    <div class="meta-row"><span class="meta-label">手机号：</span><span class="meta-value">${escapeHtml(r.contactPhone || '-')}</span></div>
                    <div class="meta-row"><span class="meta-label">价格：</span><span class="meta-value price">${escapeHtml(price)}</span></div>
                    <div class="meta-row"><span class="meta-label">ECEE：</span><span class="meta-value">${ecee}</span></div>
                    <div class="meta-row"><span class="meta-label">提交：</span><span class="meta-value">${formatTime(r.createTime)}</span></div>
                </div>
                ${remarkHtml}
            </div>
            <div class="req-actions">${actions}</div>
        </div>
    `;
}

function statusText(s) {
    return { pending: '待审核', approved: '已通过', rejected: '已驳回' }[s] || s;
}
function formatTime(t) { return t ? t.replace('T', ' ').substring(0, 16) : '-'; }

/* ============ 分页 ============ */
function renderPagination(total) {
    const pag = document.getElementById('pagination');
    const totalPages = Math.ceil(total / PAGE_SIZE);
    if (totalPages <= 1) { pag.style.display = 'none'; return; }
    pag.style.display = 'flex';

    const max = 7;
    let start = Math.max(1, currentPage - 3);
    let end = Math.min(totalPages, start + max - 1);
    start = Math.max(1, end - max + 1);

    let html = '';
    html += `<button ${currentPage === 1 ? 'disabled' : ''} onclick="gotoPage(${currentPage - 1})">上一页</button>`;
    if (start > 1) {
        html += `<button onclick="gotoPage(1)">1</button>`;
        if (start > 2) html += `<button disabled>...</button>`;
    }
    for (let i = start; i <= end; i++) {
        html += `<button class="${i === currentPage ? 'active' : ''}" onclick="gotoPage(${i})">${i}</button>`;
    }
    if (end < totalPages) {
        if (end < totalPages - 1) html += `<button disabled>...</button>`;
        html += `<button onclick="gotoPage(${totalPages})">${totalPages}</button>`;
    }
    html += `<button ${currentPage === totalPages ? 'disabled' : ''} onclick="gotoPage(${currentPage + 1})">下一页</button>`;
    pag.innerHTML = html;
}
function gotoPage(p) { currentPage = p; loadList(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

/* ============ 详情弹窗 ============ */
async function viewDetail(id) {
    const body = document.getElementById('detailBody');
    body.innerHTML = '<div class="loading" style="padding:40px;">加载中...</div>';
    openModal('detailModal');

    try {
        const resp = await fetch(`${API_BASE}/requirement/detail/${encodeURIComponent(id)}`, {
            headers: { 'Authorization': localStorage.getItem('token') }
        });
        const result = await resp.json();
        if (resp.ok && result.code === 0 && result.data) {
            renderDetail(result.data);
        } else {
            body.innerHTML = `<div class="error-box">${escapeHtml(result.message || result.msg || '加载失败')}</div>`;
        }
    } catch (err) {
        body.innerHTML = '<div class="error-box">网络错误</div>';
    }
}

function renderDetail(r) {
    const cat = CATEGORY_MAP[r.categoryId] || `品类#${r.categoryId}`;
    const price = (r.minPrice != null || r.maxPrice != null)
        ? `¥${r.minPrice || 0} ~ ¥${r.maxPrice || '面议'}`
        : '价格面议';
    const ecee = r.needEcee === 1 ? '✓ 需要' : '✗ 不需要';

    let filesHtml = '<span style="color:#999;">无附件</span>';
    if (r.files && r.files.length) {
        filesHtml = r.files.map(f => `
            <a class="file-link" href="${getDownloadUrl(f.filePath)}" target="_blank" rel="noopener">
                📎 ${escapeHtml(f.originalName || f.filePath)}
                ${f.fileSize ? `<span style="color:#999;font-size:12px;margin-left:8px;">(${formatSize(f.fileSize)})</span>` : ''}
            </a>
        `).join('');
    }

    document.getElementById('detailBody').innerHTML = `
        <div class="detail-row"><div class="detail-label">ID</div><div class="detail-value">#${r.id}</div></div>
        <div class="detail-row"><div class="detail-label">类型</div><div class="detail-value">${TYPE_MAP[r.type] || r.type}</div></div>
        <div class="detail-row"><div class="detail-label">名称</div><div class="detail-value">${escapeHtml(r.name)}</div></div>
        <div class="detail-row"><div class="detail-label">品类</div><div class="detail-value">${escapeHtml(cat)}</div></div>
        <div class="detail-row"><div class="detail-label">价格区间</div><div class="detail-value">${escapeHtml(price)}</div></div>
        <div class="detail-row"><div class="detail-label">ECEE检测</div><div class="detail-value">${ecee}</div></div>
        <div class="detail-row"><div class="detail-label">企业/联系人</div><div class="detail-value">${escapeHtml(r.contactName || '-')}</div></div>
        <div class="detail-row"><div class="detail-label">联系电话</div><div class="detail-value">${escapeHtml(r.contactPhone || '-')}</div></div>
        <div class="detail-row"><div class="detail-label">发布者</div><div class="detail-value">${escapeHtml(r.username || '-')}</div></div>
        <div class="detail-row"><div class="detail-label">提交时间</div><div class="detail-value">${formatTime(r.createTime)}</div></div>
        ${r.auditedAt ? `<div class="detail-row"><div class="detail-label">审核时间</div><div class="detail-value">${formatTime(r.auditedAt)}</div></div>` : ''}
        ${r.auditRemark ? `<div class="detail-row"><div class="detail-label">${r.status === 'approved' ? '审核备注' : '驳回原因'}</div><div class="detail-value" style="color:${r.status === 'approved' ? '#389e0d' : '#cf1322'};">${escapeHtml(r.auditRemark)}</div></div>` : ''}
        <div class="detail-row"><div class="detail-label">附件</div><div class="detail-value">${filesHtml}</div></div>
    `;
}

function getDownloadUrl(filePath) {
    if (!filePath) return '#';
    const pureName = filePath.indexOf('/') > -1
        ? filePath.substring(filePath.indexOf('/') + 1)
        : filePath;
    return `${API_BASE}/minio/fileDownload/${encodeURIComponent(pureName)}`;
}
function formatSize(bytes) {
    if (!bytes) return '';
    const units = ['B', 'KB', 'MB', 'GB'];
    let i = 0;
    while (bytes >= 1024 && i < units.length - 1) { bytes /= 1024; i++; }
    return bytes.toFixed(1) + ' ' + units[i];
}

/* ============ 审核：通过 / 驳回 ============ */
async function approve(id) {
    if (!confirm(`确认通过需求 #${id} 的审核？`)) return;
    try {
        const resp = await fetch(`${API_BASE}/requirement/audit/${id}`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': localStorage.getItem('token')
            },
            body: JSON.stringify({ action: 'approve' })
        });
        const result = await resp.json();
        if (resp.ok && result.code === 0) {
            showToast('已通过审核', 'success');
            loadList();
        } else {
            showToast(result.message || result.msg || '操作失败', 'error');
        }
    } catch (err) {
        showToast('网络错误', 'error');
    }
}

function openReject(id) {
    pendingRejectId = id;
    document.getElementById('rejectReason').value = '';
    openModal('rejectModal');
    setTimeout(() => document.getElementById('rejectReason').focus(), 100);
}

async function confirmReject() {
    const reason = document.getElementById('rejectReason').value.trim();
    if (!reason) {
        showToast('请填写驳回原因', 'error');
        return;
    }
    if (!pendingRejectId) return;
    const id = pendingRejectId;
    try {
        const resp = await fetch(`${API_BASE}/requirement/audit/${id}`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': localStorage.getItem('token')
            },
            body: JSON.stringify({ action: 'reject', remark: reason })
        });
        const result = await resp.json();
        if (resp.ok && result.code === 0) {
            showToast('已驳回', 'success');
            closeModal('rejectModal');
            pendingRejectId = null;
            loadList();
        } else {
            showToast(result.message || result.msg || '操作失败', 'error');
        }
    } catch (err) {
        showToast('网络错误', 'error');
    }
}

/* ============ 弹窗/Toast 工具 ============ */
function openModal(id)  { document.getElementById(id).classList.add('show'); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }
function showToast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `toast ${type} show`;
    setTimeout(() => t.classList.remove('show'), 2500);
}

/* ============ 返回 ============ */
function goBack() {
    if (document.referrer && document.referrer.indexOf('index') !== -1) {
        history.back();
    } else {
        window.location.href = '../../index.html';
    }
}

/* ============ 工具 ============ */
function escapeHtml(s) {
    if (s == null) return '';
    return String(s).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[c]);
}

/* ============ 启动 ============ */
if (ensureAdmin()) {
    loadList();
}

// 点击弹窗外关闭
document.addEventListener('click', e => {
    if (e.target.classList && e.target.classList.contains('modal-overlay')) {
        e.target.classList.remove('show');
    }
});
</script>
