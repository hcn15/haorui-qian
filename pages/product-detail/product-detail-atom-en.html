    <style>
        html, body {
            max-width: 100vw;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
            background: #fff;
            color: #333;
            font-family: "Microsoft YaHei", "SimSun", "宋体", sans-serif;
        }

        .product-detail {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .hero-section {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 160px 40px;
            background: linear-gradient(135deg, #0a1628 0%, #1a365d 50%, #0d2137 100%);
            border-radius: 16px;
            margin-bottom: 40px;
            position: relative;
            overflow: hidden;
        }

        .hero-section::before {
            content: "";
            position: absolute;
            top: 0;
            right: 0;
            width: 55%;
            height: 100%;
            background-image: url('../../img/dobot/atom-main.jpg');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center center;
            opacity: 0.6;
        }

        .hero-section .hero-content {
            flex: 1;
            text-align: left;
            position: relative;
            z-index: 1;
        }

        .hero-section .tagline {
            font-size: 16px;
            color: #4fc3f7;
            margin: 0 0 15px;
            letter-spacing: 2px;
        }

        .hero-section h1 {
            font-size: 48px;
            font-weight: bold;
            color: #fff;
            margin: 0 0 15px;
        }

        .hero-section .subtitle {
            font-size: 24px;
            color: #b3e5fc;
            margin: 0 0 20px;
        }

        .hero-section .description {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.8;
            margin: 0 0 30px;
            max-width: 600px;
        }

        .hero-features {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }

        .hero-feature {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fff;
            font-size: 14px;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
        }

        .hero-feature svg {
            width: 20px;
            height: 20px;
        }

        .section-title {
            font-size: 28px;
            font-weight: bold;
            color: #0a3a8f;
            margin: 0 0 25px;
            text-align: center;
            position: relative;
            padding-bottom: 15px;
        }

        .section-title::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, #004a99, #1967c2);
            border-radius: 2px;
        }

        .about-section {
            text-align: center;
            padding: 50px 20px;
            margin-bottom: 50px;
        }

        .about-section p {
            font-size: 16px;
            color: #444;
            line-height: 2;
            margin: 0 0 15px;
            max-width: 800px;
            display: inline-block;
            text-align: justify;
        }

        .features-section {
            background: #f8fafc;
            padding: 50px 20px;
            border-radius: 12px;
            margin-bottom: 50px;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
        }

        .feature-card {
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            border: 1px solid #e8e8e8;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .feature-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        }

        .feature-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .feature-card .content {
            padding: 24px;
            flex: 1;
        }

        .feature-card .content .feature-tag {
            font-size: 12px;
            color: #1967c2;
            background: #e3f2fd;
            padding: 4px 12px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 12px;
        }

        .feature-card .content h3 {
            font-size: 20px;
            font-weight: bold;
            color: #0a3a8f;
            margin: 0 0 12px;
        }

        .feature-card .content p {
            font-size: 14px;
            color: #666;
            line-height: 1.7;
            margin: 0;
        }

        .versions-section {
            margin-bottom: 50px;
        }

        .versions-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
        }

        .version-card {
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            border: 1px solid #e8e8e8;
            transition: all 0.3s ease;
        }

        .version-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        }

        .version-card img {
            width: 100%;
            height: 200px;
            object-fit: contain;
            background: #f5f8fc;
        }

        .version-card .version-header {
            padding: 16px 20px;
            background: linear-gradient(135deg, #004a99, #1967c2);
            color: #fff;
        }

        .version-card .version-header h3 {
            font-size: 18px;
            font-weight: bold;
            margin: 0;
        }

        .version-card .version-header .version-subtitle {
            font-size: 12px;
            opacity: 0.8;
            margin-top: 4px;
        }

        .version-card .version-info {
            padding: 20px;
        }

        .version-card .version-info ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .version-card .version-info ul li {
            font-size: 14px;
            color: #555;
            line-height: 1.8;
            padding: 6px 0;
            border-bottom: 1px dashed #eee;
            position: relative;
            padding-left: 16px;
        }

        .version-card .version-info ul li::before {
            content: "✓";
            position: absolute;
            left: 0;
            color: #4caf50;
            font-weight: bold;
        }

        .version-card .version-info ul li:last-child {
            border-bottom: none;
        }

        .scenario-section {
            background: #f8fafc;
            padding: 50px 20px;
            border-radius: 12px;
            margin-bottom: 50px;
        }

        .scenario-image {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .scenario-section p {
            font-size: 16px;
            color: #444;
            line-height: 1.8;
            margin: 0;
            text-align: center;
            max-width: 900px;
            display: inline-block;
        }

        .specs-section {
            margin-bottom: 50px;
        }

        .specs-section h3 {
            font-size: 20px;
            font-weight: bold;
            color: #0a3a8f;
            margin: 0 0 20px;
        }

        .spec-table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            border: 1px solid #e8e8e8;
        }

        .spec-table th {
            background: linear-gradient(90deg, #004a99, #1967c2);
            color: #fff;
            padding: 12px 15px;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
            white-space: nowrap;
        }

        .spec-table td {
            padding: 10px 15px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
            color: #444;
            text-align: center;
        }

        .spec-table tr:nth-child(even) td {
            background: #fafafa;
        }

        .spec-table tr:hover td {
            background: #f0f5fc;
        }

        .nav-back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 8px 20px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.3s ease;
            margin-right: 15px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .nav-back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        

        
    </style>
</head>

    <script>
        $(document).on('click', 'a', function () {
            href = $(this).attr('href');
            if ($(this).attr('href') == '') {
                event.preventDefault();
            } else if (href.startsWith('http://') || href.startsWith('https://')) {
                $(this).attr('target', '_blank');
            }
        })
    </script>
