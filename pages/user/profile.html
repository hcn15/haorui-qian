<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人主页 - 浩瑞科技</title>
    <link rel="stylesheet" type="text/css" href="../../index_files/g-style.css">
    <script src="../../config1.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
            color: #333; background: #f7f9fc;
            -webkit-font-smoothing: antialiased; min-height: 100vh;
        }
        a { text-decoration: none; color: inherit; }
        ul, ol { list-style: none; }

        /* ===== 顶部导航条 ===== */
        .top-bar {
            background: #fff; border-bottom: 1px solid #e8ecf1;
            position: sticky; top: 0; z-index: 100;
        }
        .top-bar-inner {
            max-width: 960px; margin: 0 auto; padding: 14px 20px;
            display: flex; align-items: center; gap: 16px;
        }
        .back-btn {
            display: flex; align-items: center; gap: 4px;
            color: #0a4db4; font-size: 14px; font-weight: 500;
            cursor: pointer; padding: 6px 12px; border-radius: 4px;
            transition: background 0.2s;
        }
        .back-btn:hover { background: #e8f0fe; }
        .page-title {
            flex: 1; text-align: center; font-size: 17px; font-weight: bold;
            color: #333; letter-spacing: 1px;
        }
        .header-logo { display: flex; align-items: center; gap: 8px; }
        .header-logo .logo-icon { width: 36px; height: 36px; object-fit: contain; }
        .header-logo .logo-text { font-size: 16px; font-weight: bold; color: #333; }
        .header-logo .logo-text .highlight { color: #0a4db4; }

        /* ===== 主体容器 ===== */
        .container { max-width: 960px; margin: 0 auto; padding: 24px 20px 60px; }

        /* ===== 个人信息卡片 ===== */
        .profile-card {
            background: #fff; border-radius: 12px;
            box-shadow: 0 2px 12px rgba(10,77,180,0.08);
            overflow: hidden; margin-bottom: 20px;
        }
        .profile-header {
            padding: 24px 28px;
            background: linear-gradient(135deg, #0a4db4 0%, #1e6fd9 100%);
            color: #fff;
            display: flex; align-items: center; gap: 18px;
        }
        .avatar-wrap {
            position: relative; width: 80px; height: 80px;
            flex-shrink: 0;
        }
        .avatar {
            width: 80px; height: 80px; border-radius: 50%;
            object-fit: cover; border: 3px solid #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            background: #fff;
        }
        .avatar-fallback {
            width: 80px; height: 80px; border-radius: 50%;
            background: #fff; color: #0a4db4;
            display: flex; align-items: center; justify-content: center;
            font-size: 32px; font-weight: bold;
            border: 3px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .avatar-edit-btn {
            position: absolute; bottom: -2px; right: -2px;
            width: 28px; height: 28px; border-radius: 50%;
            background: #fff; color: #0a4db4;
            border: 2px solid #0a4db4;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 14px; transition: all 0.2s;
        }
        .avatar-edit-btn:hover { background: #0a4db4; color: #fff; transform: scale(1.1); }
        .profile-info { flex: 1; min-width: 0; }
        .profile-info .username {
            font-size: 20px; font-weight: bold; margin-bottom: 6px;
            word-break: break-all;
        }
        .profile-info .role-tag {
            display: inline-block; padding: 3px 10px; border-radius: 4px;
            font-size: 12px; font-weight: 500;
            background: rgba(255,255,255,0.25);
        }
        .profile-info .role-tag.admin { background: rgba(255,215,0,0.25); color: #ffd700; }
        .profile-info .member-since {
            font-size: 12px; opacity: 0.85; margin-top: 6px;
        }

        /* ===== 快捷入口 ===== */
        .quick-links {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px; padding: 16px 28px;
            background: #fafbfc; border-top: 1px solid #f0f3f7;
        }
        .quick-link {
            display: flex; flex-direction: column; align-items: center; gap: 6px;
            padding: 12px 8px; background: #fff;
            border-radius: 8px; border: 1px solid #eef2f7;
            transition: all 0.2s; cursor: pointer;
            color: #333; text-align: center;
        }
        .quick-link:hover {
            transform: translateY(-2px); box-shadow: 0 4px 12px rgba(10,77,180,0.12);
            border-color: #0a4db4; color: #0a4db4;
        }
        .quick-link .link-icon { font-size: 24px; }
        .quick-link .link-text { font-size: 13px; }

        /* ===== 子模块卡片 ===== */
        .section-card {
            background: #fff; border-radius: 12px;
            box-shadow: 0 2px 12px rgba(10,77,180,0.08);
            margin-bottom: 20px; overflow: hidden;
        }
        .section-head {
            padding: 16px 22px; border-bottom: 1px solid #f0f3f7;
            display: flex; align-items: center; justify-content: space-between;
        }
        .section-head h2 {
            font-size: 16px; font-weight: bold; color: #333;
            display: flex; align-items: center; gap: 8px;
        }
        .section-head h2 .icon { font-size: 18px; }
        .section-head .toggle-edit {
            font-size: 13px; color: #0a4db4; cursor: pointer;
            padding: 4px 10px; border-radius: 4px; transition: background 0.2s;
        }
        .section-head .toggle-edit:hover { background: #e8f0fe; }
        .section-body { padding: 20px 22px; }

        /* ===== 表单 ===== */
        .form-row {
            display: flex; align-items: center; gap: 12px;
            margin-bottom: 16px;
        }
        .form-row:last-child { margin-bottom: 0; }
        .form-label {
            width: 100px; flex-shrink: 0;
            color: #666; font-size: 14px;
        }
        .form-label .required { color: #ff4d4f; margin-left: 2px; }
        .form-control {
            flex: 1; max-width: 400px;
            padding: 9px 12px; font-size: 14px;
            border: 1px solid #d9e0ea; border-radius: 6px;
            background: #fafbfc; color: #333;
            font-family: inherit;
            transition: all 0.2s;
        }
        .form-control:focus { outline: none; border-color: #0a4db4; background: #fff; }
        .form-control:disabled { background: #f5f5f5; color: #999; cursor: not-allowed; }
        .form-control.error { border-color: #ff4d4f; background: #fff5f5; }
        .form-hint { font-size: 12px; color: #999; margin-top: 4px; }
        .form-hint.error { color: #ff4d4f; }

        .form-actions {
            display: flex; gap: 10px; padding-top: 12px;
            border-top: 1px dashed #f0f3f7; margin-top: 16px;
        }
        .btn {
            padding: 9px 24px; font-size: 14px; font-weight: 500;
            border: none; border-radius: 6px; cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #0a4db4 0%, #1e6fd9 100%);
            color: #fff;
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(10,77,180,0.3); }
        .btn-primary:disabled { background: #ccc; cursor: not-allowed; transform: none; box-shadow: none; }
        .btn-secondary {
            background: #fff; color: #666;
            border: 1px solid #d9e0ea;
        }
        .btn-secondary:hover { background: #f5f5f5; }

        /* ===== 头像上传弹窗 ===== */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.5);
            display: none; align-items: center; justify-content: center;
            z-index: 9999; padding: 20px;
        }
        .modal-overlay.show { display: flex; }
        .modal-box {
            background: #fff; border-radius: 12px;
            max-width: 480px; width: 100%;
            animation: popIn 0.25s ease-out;
        }
        @keyframes popIn {
            from { transform: scale(0.92); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .modal-head {
            padding: 16px 24px; border-bottom: 1px solid #f0f3f7;
            display: flex; align-items: center; justify-content: space-between;
        }
        .modal-head h3 { font-size: 16px; color: #333; }
        .modal-close {
            width: 28px; height: 28px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            border: none; background: transparent; font-size: 18px;
            color: #999; border-radius: 4px;
        }
        .modal-close:hover { background: #f5f5f5; color: #333; }
        .modal-body { padding: 20px 24px; }
        .modal-foot {
            padding: 14px 24px; border-top: 1px solid #f0f3f7;
            display: flex; justify-content: flex-end; gap: 8px;
        }
        .upload-zone {
            border: 2px dashed #d9e0ea; border-radius: 8px;
            padding: 30px 20px; text-align: center; cursor: pointer;
            transition: all 0.2s;
        }
        .upload-zone:hover, .upload-zone.dragover {
            border-color: #0a4db4; background: #f0f5ff;
        }
        .upload-zone .upload-icon { font-size: 40px; margin-bottom: 8px; }
        .upload-zone .upload-text { font-size: 14px; color: #666; }
        .upload-zone .upload-hint { font-size: 12px; color: #999; margin-top: 4px; }
        .preview-area {
            margin-top: 14px; display: none;
            text-align: center;
        }
        .preview-area.show { display: block; }
        .preview-area img {
            width: 120px; height: 120px; border-radius: 50%;
            object-fit: cover; border: 2px solid #f0f3f7;
            margin-bottom: 8px;
        }
        .preview-area .preview-name { font-size: 13px; color: #666; }

        /* ===== Toast ===== */
        .toast {
            position: fixed; top: 80px; left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px; border-radius: 8px;
            font-size: 14px; z-index: 10000;
            opacity: 0; transition: opacity 0.3s, top 0.3s;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }
        .toast.show { opacity: 1; top: 100px; }
        .toast.success { background: #f6ffed; color: #389e0d; border: 1px solid #b7eb8f; }
        .toast.error { background: #fff1f0; color: #cf1322; border: 1px solid #ffa39e; }

        /* ===== 加载和错误 ===== */
        .loading, .error-box {
            text-align: center; padding: 80px 20px;
            color: #999; font-size: 14px;
        }
        .error-box { color: #cf1322; }

        @media (max-width: 768px) {
            .container { padding: 16px 12px 40px; }
            .profile-header { padding: 18px 16px; gap: 12px; }
            .avatar-wrap, .avatar, .avatar-fallback { width: 60px; height: 60px; }
            .avatar-fallback { font-size: 24px; }
            .form-row { flex-direction: column; align-items: flex-start; gap: 6px; }
            .form-label { width: auto; }
            .form-control { max-width: 100%; width: 100%; }
            .section-body, .section-head { padding: 16px; }
        }
    </style>
</head>
<body>

<!-- ============ 顶部导航 ============ -->
<div class="top-bar">
    <div class="top-bar-inner">
        <div class="back-btn" onclick="goBack()">◀ 返回</div>
        <div class="page-title">个人主页</div>
        <div class="header-logo">
            <img class="logo-icon" src="../../img/JSlogo-beb0d75f.png" alt="Logo">
            <div class="logo-text">黑科技 <span class="highlight">商城</span></div>
        </div>
    </div>
</div>

<!-- ============ 主体 ============ -->
<div class="container">

    <!-- 个人信息卡片 -->
    <div class="profile-card" id="profileCard" style="display:none;">
        <div class="profile-header">
            <div class="avatar-wrap">
                <img id="userAvatar" class="avatar" alt="头像">
                <div id="avatarFallback" class="avatar-fallback" style="display:none;">U</div>
                <div class="avatar-edit-btn" onclick="openAvatarModal()" title="修改头像">✎</div>
            </div>
            <div class="profile-info">
                <div class="username" id="displayName">用户名</div>
                <div>
                    <span class="role-tag" id="roleTag">普通用户</span>
                </div>
                <div class="member-since" id="memberSince">注册时间：-</div>
            </div>
        </div>
        <!-- 快捷入口 -->
        <div class="quick-links">
            <a class="quick-link" href="my-requirements.html">
                <div class="link-icon">📋</div>
                <div class="link-text">我的需求</div>
            </a>
            <a class="quick-link" href="cart.html">
                <div class="link-icon">🛒</div>
                <div class="link-text">购物车</div>
            </a>
            <a class="quick-link" href="favorite.html">
                <div class="link-icon">⭐</div>
                <div class="link-text">我的收藏</div>
            </a>
            <a class="quick-link" href="order.html">
                <div class="link-icon">📦</div>
                <div class="link-text">我的订单</div>
            </a>
            <a class="quick-link" href="publish.html">
                <div class="link-icon">✏️</div>
                <div class="link-text">发布需求</div>
            </a>
        </div>
    </div>

    <!-- 基本信息 -->
    <div class="section-card" id="infoSection" style="display:none;">
        <div class="section-head">
            <h2><span class="icon">👤</span>基本信息</h2>
            <span class="toggle-edit" id="toggleEditBtn" onclick="toggleEditMode()">编辑</span>
        </div>
        <div class="section-body">
            <div class="form-row">
                <label class="form-label">用户名</label>
                <input type="text" id="username" class="form-control" disabled>
                <div class="form-hint" style="margin: 0 0 0 12px;">用户名注册后不可修改</div>
            </div>
            <div class="form-row">
                <label class="form-label">昵称<span class="required">*</span></label>
                <input type="text" id="nickname" class="form-control" disabled maxlength="10" placeholder="2-10位昵称">
                <div class="form-hint" id="nicknameHint" style="margin: 0 0 0 12px;"></div>
            </div>
            <div class="form-row">
                <label class="form-label">邮箱<span class="required">*</span></label>
                <input type="email" id="email" class="form-control" disabled maxlength="50" placeholder="请输入有效邮箱">
                <div class="form-hint" id="emailHint" style="margin: 0 0 0 12px;"></div>
            </div>
            <div class="form-actions" id="infoActions" style="display:none;">
                <button class="btn btn-primary" onclick="saveInfo()">保存修改</button>
                <button class="btn btn-secondary" onclick="cancelEdit()">取消</button>
            </div>
        </div>
    </div>

    <!-- 修改密码 -->
    <div class="section-card" id="pwdSection" style="display:none;">
        <div class="section-head">
            <h2><span class="icon">🔒</span>修改密码</h2>
        </div>
        <div class="section-body">
            <div class="form-row">
                <label class="form-label">原密码<span class="required">*</span></label>
                <input type="password" id="oldPwd" class="form-control" maxlength="16" placeholder="请输入当前密码">
            </div>
            <div class="form-row">
                <label class="form-label">新密码<span class="required">*</span></label>
                <input type="password" id="newPwd" class="form-control" maxlength="16" placeholder="5-16位，不含空格">
                <div class="form-hint" id="newPwdHint" style="margin: 0 0 0 12px;"></div>
            </div>
            <div class="form-row">
                <label class="form-label">确认密码<span class="required">*</span></label>
                <input type="password" id="rePwd" class="form-control" maxlength="16" placeholder="请再次输入新密码">
                <div class="form-hint" id="rePwdHint" style="margin: 0 0 0 12px;"></div>
            </div>
            <div class="form-actions">
                <button class="btn btn-primary" onclick="savePwd()">修改密码</button>
                <button class="btn btn-secondary" onclick="resetPwdForm()">清空</button>
            </div>
        </div>
    </div>

</div>

<!-- ============ 头像上传弹窗 ============ -->
<div class="modal-overlay" id="avatarModal">
    <div class="modal-box">
        <div class="modal-head">
            <h3>修改头像</h3>
            <button class="modal-close" onclick="closeModal('avatarModal')">×</button>
        </div>
        <div class="modal-body">
            <div class="upload-zone" id="uploadZone" onclick="document.getElementById('avatarInput').click()">
                <div class="upload-icon">📁</div>
                <div class="upload-text">点击或拖拽图片到此处上传</div>
                <div class="upload-hint">支持 JPG/PNG/GIF/WebP，最大 5MB</div>
                <input type="file" id="avatarInput" accept="image/*" style="display:none;" onchange="handleAvatarSelect(event)">
            </div>
            <div class="preview-area" id="previewArea">
                <img id="previewImg" alt="预览">
                <div class="preview-name" id="previewName"></div>
            </div>
        </div>
        <div class="modal-foot">
            <button class="btn btn-secondary" onclick="closeModal('avatarModal')">取消</button>
            <button class="btn btn-primary" id="uploadAvatarBtn" onclick="uploadAvatar()" disabled>确认上传</button>
        </div>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
const API_BASE = window.SERVER_BASE_URL || '';
let originalUser = null;       // 后端返回的原始数据
let editMode = false;
let pendingAvatarFile = null;  // 待上传的头像 File 对象

/* ============ 登录校验 ============ */
function ensureLogin() {
    const token = localStorage.getItem('token');
    if (!token || checkTokenExpired()) {
        const cur = window.location.pathname.replace(/^\//, '') + (window.location.search || '');
        window.location.href = 'login.html?redirect=' + encodeURIComponent(cur);
        return false;
    }
    return true;
}

/* ============ 加载用户信息 ============ */
async function loadUserInfo() {
    try {
        const resp = await fetch(`${API_BASE}/user/userInfo`, {
            headers: { 'Authorization': localStorage.getItem('token') }
        });
        if (resp.status === 401) {
            const cur = window.location.pathname.replace(/^\//, '') + (window.location.search || '');
            window.location.href = 'login.html?redirect=' + encodeURIComponent(cur);
            return;
        }
        const result = await resp.json();
        if (resp.ok && result.code === 0 && result.data) {
            originalUser = result.data;
            renderUser(originalUser);
            document.getElementById('profileCard').style.display = 'block';
            document.getElementById('infoSection').style.display = 'block';
            document.getElementById('pwdSection').style.display = 'block';
        } else {
            showToast(result.message || result.msg || '加载失败', 'error');
        }
    } catch (err) {
        console.error('加载用户信息错误:', err);
        showToast('网络错误', 'error');
    }
}

/* ============ 渲染用户信息 ============ */
function renderUser(u) {
    // 顶部头像区
    const avatar = document.getElementById('userAvatar');
    const fallback = document.getElementById('avatarFallback');
    if (u.userPic) {
        avatar.src = u.userPic;
        avatar.style.display = 'block';
        fallback.style.display = 'none';
        avatar.onerror = () => {
            avatar.style.display = 'none';
            fallback.style.display = 'flex';
            fallback.textContent = (u.nickname || u.username || 'U').charAt(0).toUpperCase();
        };
    } else {
        avatar.style.display = 'none';
        fallback.style.display = 'flex';
        fallback.textContent = (u.nickname || u.username || 'U').charAt(0).toUpperCase();
    }

    document.getElementById('displayName').textContent = u.nickname || u.username || '用户';
    const roleTag = document.getElementById('roleTag');
    if (u.roleId === 1) {
        roleTag.textContent = '管理员';
        roleTag.className = 'role-tag admin';
    } else if (u.roleId === 2) {
        roleTag.textContent = '卖方用户';
    } else if (u.roleId === 3) {
        roleTag.textContent = '买方用户';
    } else {
        roleTag.textContent = '普通用户';
    }

    document.getElementById('memberSince').textContent = u.createTime
        ? `注册时间：${u.createTime.replace('T', ' ').substring(0, 10)}`
        : '注册时间：-';

    // 基本信息表单
    document.getElementById('username').value = u.username || '';
    document.getElementById('nickname').value = u.nickname || '';
    document.getElementById('email').value = u.email || '';
}

/* ============ 编辑模式切换 ============ */
function toggleEditMode() {
    editMode = !editMode;
    const nickname = document.getElementById('nickname');
    const email = document.getElementById('email');
    const actions = document.getElementById('infoActions');
    const toggleBtn = document.getElementById('toggleEditBtn');

    if (editMode) {
        nickname.disabled = false;
        email.disabled = false;
        actions.style.display = 'flex';
        toggleBtn.textContent = '取消编辑';
        nickname.focus();
    } else {
        // 取消编辑：恢复原值
        if (originalUser) {
            nickname.value = originalUser.nickname || '';
            email.value = originalUser.email || '';
        }
        nickname.disabled = true;
        email.disabled = true;
        actions.style.display = 'none';
        toggleBtn.textContent = '编辑';
        clearHints();
    }
}

function cancelEdit() {
    editMode = false;
    toggleEditMode();
    toggleEditMode();
}

function clearHints() {
    ['nicknameHint', 'emailHint', 'newPwdHint', 'rePwdHint'].forEach(id => {
        document.getElementById(id).textContent = '';
    });
    ['nickname', 'email', 'newPwd', 'rePwd'].forEach(id => {
        document.getElementById(id).classList.remove('error');
    });
}

/* ============ 保存基本信息 ============ */
async function saveInfo() {
    clearHints();
    if (!originalUser) return;

    const nickname = document.getElementById('nickname').value.trim();
    const email = document.getElementById('email').value.trim();
    let hasError = false;

    if (!nickname) {
        document.getElementById('nicknameHint').textContent = '昵称不能为空';
        document.getElementById('nickname').classList.add('error');
        hasError = true;
    } else if (nickname.length < 2 || nickname.length > 10) {
        document.getElementById('nicknameHint').textContent = '昵称长度2-10位';
        document.getElementById('nickname').classList.add('error');
        hasError = true;
    }
    if (!email) {
        document.getElementById('emailHint').textContent = '邮箱不能为空';
        document.getElementById('email').classList.add('error');
        hasError = true;
    } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        document.getElementById('emailHint').textContent = '邮箱格式不正确';
        document.getElementById('email').classList.add('error');
        hasError = true;
    }
    if (hasError) return;

    // 构造更新请求体（PUT /user/update 需要完整的 User 校验，故带上 id 等必填字段）
    const body = {
        id: originalUser.id,
        username: originalUser.username,
        nickname: nickname,
        email: email,
        userPic: originalUser.userPic || ''
    };

    const btn = document.querySelector('#infoActions .btn-primary');
    const oldText = btn.textContent;
    btn.disabled = true;
    btn.textContent = '保存中...';

    try {
        const resp = await fetch(`${API_BASE}/user/update`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': localStorage.getItem('token')
            },
            body: JSON.stringify(body)
        });
        const result = await resp.json();
        if (resp.ok && result.code === 0) {
            showToast('保存成功', 'success');
            originalUser.nickname = nickname;
            originalUser.email = email;
            // 退出编辑模式并刷新顶部展示
            editMode = false;
            document.getElementById('nickname').disabled = true;
            document.getElementById('email').disabled = true;
            document.getElementById('infoActions').style.display = 'none';
            document.getElementById('toggleEditBtn').textContent = '编辑';
            renderUser(originalUser);
        } else if (resp.status === 401) {
            const cur = window.location.pathname.replace(/^\//, '') + (window.location.search || '');
            window.location.href = 'login.html?redirect=' + encodeURIComponent(cur);
        } else {
            showToast(result.message || result.msg || '保存失败', 'error');
        }
    } catch (err) {
        console.error('保存错误:', err);
        showToast('网络错误', 'error');
    } finally {
        btn.disabled = false;
        btn.textContent = oldText;
    }
}

/* ============ 修改密码 ============ */
async function savePwd() {
    clearHints();
    const oldPwd = document.getElementById('oldPwd').value;
    const newPwd = document.getElementById('newPwd').value;
    const rePwd = document.getElementById('rePwd').value;
    let hasError = false;

    if (!oldPwd) {
        showToast('请输入原密码', 'error');
        return;
    }
    if (!newPwd) {
        document.getElementById('newPwdHint').textContent = '新密码不能为空';
        document.getElementById('newPwd').classList.add('error');
        hasError = true;
    } else if (!/^\S{5,16}$/.test(newPwd)) {
        document.getElementById('newPwdHint').textContent = '密码长度5-16位，不含空格';
        document.getElementById('newPwd').classList.add('error');
        hasError = true;
    }
    if (!rePwd) {
        document.getElementById('rePwdHint').textContent = '请再次输入新密码';
        document.getElementById('rePwd').classList.add('error');
        hasError = true;
    } else if (rePwd !== newPwd) {
        document.getElementById('rePwdHint').textContent = '两次输入的新密码不一致';
        document.getElementById('rePwd').classList.add('error');
        hasError = true;
    }
    if (oldPwd === newPwd) {
        document.getElementById('newPwdHint').textContent = '新密码不能与原密码相同';
        document.getElementById('newPwd').classList.add('error');
        hasError = true;
    }
    if (hasError) return;

    const btn = document.querySelector('#pwdSection .btn-primary');
    const oldText = btn.textContent;
    btn.disabled = true;
    btn.textContent = '修改中...';

    try {
        const resp = await fetch(`${API_BASE}/user/updatePwd`, {
            method: 'PATCH',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': localStorage.getItem('token')
            },
            body: JSON.stringify({
                old_pwd: oldPwd,
                new_pwd: newPwd,
                re_pwd: rePwd
            })
        });
        const result = await resp.json();
        if (resp.ok && result.code === 0) {
            showToast('密码修改成功', 'success');
            resetPwdForm();
        } else if (resp.status === 401) {
            const cur = window.location.pathname.replace(/^\//, '') + (window.location.search || '');
            window.location.href = 'login.html?redirect=' + encodeURIComponent(cur);
        } else {
            showToast(result.message || result.msg || '修改失败', 'error');
        }
    } catch (err) {
        console.error('修改密码错误:', err);
        showToast('网络错误', 'error');
    } finally {
        btn.disabled = false;
        btn.textContent = oldText;
    }
}

function resetPwdForm() {
    document.getElementById('oldPwd').value = '';
    document.getElementById('newPwd').value = '';
    document.getElementById('rePwd').value = '';
    clearHints();
}

/* ============ 头像上传 ============ */
function openAvatarModal() {
    pendingAvatarFile = null;
    document.getElementById('previewArea').classList.remove('show');
    document.getElementById('uploadAvatarBtn').disabled = true;
    document.getElementById('avatarInput').value = '';
    openModal('avatarModal');
}

function handleAvatarSelect(e) {
    const file = e.target.files[0];
    if (!file) return;
    validateAndPreview(file);
}

function validateAndPreview(file) {
    if (!file.type.startsWith('image/')) {
        showToast('请上传图片文件', 'error');
        return;
    }
    if (file.size > 5 * 1024 * 1024) {
        showToast('图片不能超过5MB', 'error');
        return;
    }
    pendingAvatarFile = file;
    const reader = new FileReader();
    reader.onload = ev => {
        document.getElementById('previewImg').src = ev.target.result;
        document.getElementById('previewName').textContent = file.name;
        document.getElementById('previewArea').classList.add('show');
        document.getElementById('uploadAvatarBtn').disabled = false;
    };
    reader.readAsDataURL(file);
}

async function uploadAvatar() {
    if (!pendingAvatarFile) return;
    const btn = document.getElementById('uploadAvatarBtn');
    const oldText = btn.textContent;
    btn.disabled = true;
    btn.textContent = '上传中...';

    const formData = new FormData();
    formData.append('file', pendingAvatarFile);

    try {
        // 1. 上传到 MinIO
        const upResp = await fetch(`${API_BASE}/minio/fileUpload`, {
            method: 'POST',
            headers: { 'Authorization': localStorage.getItem('token') },
            body: formData
        });
        const upResult = await upResp.json();
        if (!upResp.ok || upResult.code !== 0 || !upResult.data || !upResult.data.url) {
            showToast(upResult.message || upResult.msg || '图片上传失败', 'error');
            btn.disabled = false;
            btn.textContent = oldText;
            return;
        }
        const avatarUrl = upResult.data.url; // MinIO 预签名 URL

        // 2. 调用 PATCH /user/updateAvatar 保存到用户表
        const resp = await fetch(`${API_BASE}/user/updateAvatar?avatarUrl=${encodeURIComponent(avatarUrl)}`, {
            method: 'PATCH',
            headers: { 'Authorization': localStorage.getItem('token') }
        });
        const result = await resp.json();
        if (resp.ok && result.code === 0) {
            showToast('头像更新成功', 'success');
            originalUser.userPic = avatarUrl;
            renderUser(originalUser);
            closeModal('avatarModal');
        } else if (resp.status === 401) {
            const cur = window.location.pathname.replace(/^\//, '') + (window.location.search || '');
            window.location.href = 'login.html?redirect=' + encodeURIComponent(cur);
        } else {
            showToast(result.message || result.msg || '头像保存失败', 'error');
        }
    } catch (err) {
        console.error('头像上传错误:', err);
        showToast('网络错误', 'error');
    } finally {
        btn.disabled = false;
        btn.textContent = oldText;
    }
}

/* ============ 弹窗 / Toast ============ */
function openModal(id) { document.getElementById(id).classList.add('show'); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }
function showToast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `toast ${type} show`;
    setTimeout(() => t.classList.remove('show'), 2500);
}

/* ============ 返回 ============ */
function goBack() {
    if (document.referrer && document.referrer.indexOf('index') !== -1) {
        history.back();
    } else {
        window.location.href = '../../index.html';
    }
}

/* ============ 启动 ============ */
if (ensureLogin()) {
    loadUserInfo();
}

// 点击弹窗外关闭
document.addEventListener('click', e => {
    if (e.target.classList && e.target.classList.contains('modal-overlay')) {
        e.target.classList.remove('show');
    }
});

// 拖拽头像支持
const uploadZone = document.getElementById('uploadZone');
['dragenter', 'dragover'].forEach(ev => {
    uploadZone.addEventListener(ev, e => { e.preventDefault(); uploadZone.classList.add('dragover'); });
});
['dragleave', 'drop'].forEach(ev => {
    uploadZone.addEventListener(ev, e => { e.preventDefault(); uploadZone.classList.remove('dragover'); });
});
uploadZone.addEventListener('drop', e => {
    const file = e.dataTransfer.files[0];
    if (file) validateAndPreview(file);
});
</script>
