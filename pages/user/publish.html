<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发布需求 - 浩瑞科技</title>
    <link rel="stylesheet" type="text/css" href="../../index_files/g-style.css">
    <script src="../../config1.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
            color: #333; background: #f7f9fc;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }
        a { text-decoration: none; color: #333; }
        ul, ol { list-style: none; }

        /* ===== 顶部导航条 ===== */
        .top-bar {
            background: #fff; border-bottom: 1px solid #e8ecf1;
            position: sticky; top: 0; z-index: 100;
        }
        .top-bar-inner {
            max-width: 720px; margin: 0 auto; padding: 14px 20px;
            display: flex; align-items: center; gap: 16px;
        }
        .back-btn {
            display: flex; align-items: center; gap: 4px;
            color: #0a4db4; font-size: 14px; font-weight: 500;
            cursor: pointer; padding: 6px 12px; border-radius: 4px;
            transition: background 0.2s;
        }
        .back-btn:hover { background: #e8f0fe; }
        .page-title {
            flex: 1; text-align: center; font-size: 17px; font-weight: bold;
            color: #333; letter-spacing: 1px;
        }
        .header-logo {
            display: flex; align-items: center; gap: 8px;
        }
        .header-logo .logo-icon {
            width: 36px; height: 36px;
            object-fit: contain;
        }
        .header-logo .logo-text {
            font-size: 16px; font-weight: bold; color: #333;
        }
        .header-logo .logo-text .highlight { color: #0a4db4; }

        /* ===== 主体容器 ===== */
        .publish-container {
            max-width: 720px; margin: 0 auto; padding: 24px 20px 60px;
        }

        /* ===== 卡片样式 ===== */
        .card {
            background: #fff; border-radius: 12px;
            box-shadow: 0 2px 12px rgba(10,77,180,0.08);
            overflow: hidden;
        }

        /* ===== 类型切换 ===== */
        .type-tabs {
            display: flex; background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(10,77,180,0.08);
            margin-bottom: 20px; overflow: hidden;
        }
        .type-tab {
            flex: 1; padding: 16px 20px;
            text-align: center; cursor: pointer;
            font-size: 15px; font-weight: 500;
            color: #666; transition: all 0.25s;
            border-bottom: 3px solid transparent;
            position: relative;
        }
        .type-tab:hover { color: #0a4db4; background: #f7f9fc; }
        .type-tab.active {
            color: #0a4db4;
            background: linear-gradient(180deg, #f0f5ff 0%, #fff 100%);
            border-bottom-color: #0a4db4;
            font-weight: bold;
        }
        .type-tab .tab-icon { margin-right: 4px; }

        /* ===== 表单区域 ===== */
        .form-card {
            padding: 28px 28px 20px;
        }
        .form-section-title {
            font-size: 15px; font-weight: bold; color: #333;
            margin-bottom: 20px; padding-bottom: 12px;
            border-bottom: 1px solid #f0f3f7;
            display: flex; align-items: center; gap: 8px;
        }
        .form-section-title::before {
            content: ""; display: inline-block;
            width: 4px; height: 16px;
            background: linear-gradient(180deg, #0a4db4, #1e6fd9);
            border-radius: 2px;
        }

        .form-group {
            margin-bottom: 22px;
        }
        .form-group label {
            display: block; font-size: 14px; color: #333;
            margin-bottom: 8px; font-weight: 500;
        }
        .form-group label .required {
            color: #ff4d4f; margin-right: 4px;
        }
        .form-group input[type="text"],
        .form-group input[type="number"],
        .form-group select,
        .form-group textarea {
            width: 100%; padding: 12px 14px;
            border: 1px solid #d9e0ea; border-radius: 8px;
            font-size: 14px; color: #333;
            transition: border-color 0.2s, box-shadow 0.2s;
            background: #fafbfc;
            font-family: inherit;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none; border-color: #0a4db4;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(10,77,180,0.1);
        }
        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: #b8bec9;
        }

        /* 价格区间 */
        .price-range {
            display: flex; align-items: center; gap: 12px;
        }
        .price-range input {
            flex: 1;
        }
        .price-range .separator {
            color: #999; font-size: 14px; flex-shrink: 0;
        }
        .price-range .currency {
            position: absolute; left: 14px; top: 50%;
            transform: translateY(-50%);
            color: #999; font-size: 14px;
        }
        .price-input-wrap { position: relative; flex: 1; }
        .price-input-wrap input { padding-left: 28px; }

        /* 单选项 */
        .radio-group {
            display: flex; gap: 24px;
        }
        .radio-item {
            display: flex; align-items: center; gap: 8px;
            cursor: pointer; padding: 10px 18px;
            border: 1px solid #d9e0ea; border-radius: 8px;
            transition: all 0.2s;
            flex: 1; justify-content: center;
            font-size: 14px;
        }
        .radio-item:hover { border-color: #0a4db4; color: #0a4db4; }
        .radio-item input[type="radio"] { display: none; }
        .radio-item input[type="radio"]:checked + .radio-label {
            color: #0a4db4; font-weight: bold;
        }
        .radio-item:has(input:checked) {
            border-color: #0a4db4; background: #f0f5ff;
            color: #0a4db4; font-weight: bold;
        }

        /* 上传区域 */
        .upload-area {
            border: 2px dashed #d9e0ea;
            border-radius: 8px;
            padding: 28px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: #fafbfc;
        }
        .upload-area:hover {
            border-color: #0a4db4;
            background: #f0f5ff;
        }
        .upload-area .upload-icon {
            font-size: 32px; margin-bottom: 8px;
        }
        .upload-area .upload-text {
            font-size: 14px; color: #666; margin-bottom: 4px;
        }
        .upload-area .upload-hint {
            font-size: 12px; color: #b8bec9;
        }
        .upload-area input[type="file"] { display: none; }
        .file-list {
            margin-top: 10px;
        }
        .file-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 8px 12px; background: #f0f5ff;
            border-radius: 6px; margin-bottom: 6px;
            font-size: 13px; color: #0a4db4;
        }
        .file-item .remove-file {
            color: #ff4d4f; cursor: pointer; font-weight: bold;
            padding: 0 4px;
        }

        /* ===== 提示信息 ===== */
        .form-tip {
            font-size: 12px; color: #999; margin-top: 6px;
        }

        /* ===== 提交按钮 ===== */
        .submit-area {
            margin-top: 28px;
            text-align: center;
        }
        .submit-btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            width: 100%; max-width: 360px;
            padding: 16px 32px;
            background: linear-gradient(135deg, #0a4db4 0%, #1e6fd9 100%);
            color: #fff; border: none; border-radius: 10px;
            font-size: 16px; font-weight: bold; letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.25s;
            box-shadow: 0 4px 16px rgba(10,77,180,0.3);
        }
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(10,77,180,0.4);
        }
        .submit-btn:active { transform: translateY(0); }
        .submit-btn .btn-icon { font-size: 18px; }
        .submit-hint {
            margin-top: 12px; font-size: 13px; color: #999;
        }
        .submit-hint b { color: #0a4db4; }

        /* ===== 成功提示 ===== */
        .success-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.5);
            display: none; align-items: center; justify-content: center;
            z-index: 9999;
        }
        .success-overlay.show { display: flex; }
        .success-modal {
            background: #fff; border-radius: 16px;
            padding: 40px; text-align: center;
            max-width: 360px; width: 90%;
            animation: popIn 0.3s ease-out;
        }
        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .success-modal .check-icon {
            width: 64px; height: 64px;
            background: linear-gradient(135deg, #52c41a, #389e0d);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 16px;
            color: #fff; font-size: 32px;
        }
        .success-modal h3 {
            font-size: 18px; color: #333; margin-bottom: 8px;
        }
        .success-modal p {
            font-size: 14px; color: #666; margin-bottom: 20px;
        }
        .success-modal button {
            padding: 10px 28px;
            background: #0a4db4; color: #fff;
            border: none; border-radius: 8px;
            font-size: 14px; cursor: pointer;
            transition: background 0.2s;
        }
        .success-modal button:hover { background: #083d94; }

        /* ===== 底部链接 ===== */
        .bottom-links {
            text-align: center; margin-top: 20px;
            font-size: 13px; color: #999;
        }
        .bottom-links a { color: #0a4db4; }
        .bottom-links a:hover { text-decoration: underline; }

        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            .publish-container { padding: 16px 12px 40px; }
            .form-card { padding: 20px 18px 16px; }
            .type-tab { padding: 14px 10px; font-size: 14px; }
            .radio-group { flex-direction: column; gap: 10px; }
            .submit-btn { max-width: 100%; }
        }
    </style>
</head>
<body>

<!-- ============ 顶部导航 ============ -->
<div class="top-bar">
    <div class="top-bar-inner">
        <div class="back-btn" onclick="goBack()">
            ◀ 返回
        </div>
        <div class="page-title">发布需求</div>
        <div class="header-logo">
            <img class="logo-icon" src="../../img/JSlogo-beb0d75f.png" alt="Logo">
            <div class="logo-text">黑科技 <span class="highlight">商城</span></div>
        </div>
    </div>
</div>

<!-- ============ 主体 ============ -->
<div class="publish-container">

    <!-- 类型切换 -->
    <div class="type-tabs">
        <div class="type-tab" data-type="buy" onclick="switchType('buy')">
            <span class="tab-icon">🛒</span>我要买
        </div>
        <div class="type-tab active" data-type="sell" onclick="switchType('sell')">
            <span class="tab-icon">📦</span>我要卖
        </div>
        <div class="type-tab" data-type="coop" onclick="switchType('coop')">
            <span class="tab-icon">🤝</span>我要合作
        </div>
    </div>

    <!-- 表单卡片 -->
    <div class="card form-card">
        <div class="form-section-title" id="sectionTitle">发布您的产品/需求信息</div>

        <form id="publishForm" onsubmit="submitForm(event)">
            <!-- 产品/需求名称 -->
            <div class="form-group">
                <label><span class="required">*</span><span id="nameLabel">产品名称</span>：</label>
                <input type="text" id="itemName" placeholder="请输入产品/需求名称，如：六轴协作机器人CRH系列" required>
            </div>

            <!-- 所属品类 -->
            <div class="form-group">
                <label><span class="required">*</span>所属品类：</label>
                <select id="category" required>
                    <option value="">请选择产品品类</option>
                    <option value="1">人工智能和机器人</option>
                    <option value="2">前沿新材料</option>
                    <option value="3">数字服务与平台</option>
                    <option value="4">通信与网络</option>
                    <option value="5">低空经济</option>
                    <option value="6">大宗贸易</option>
                    <option value="7">文化创意与IP</option>
                    <option value="8">智慧农业与粮储</option>
                    <option value="9">安防与识别</option>
                    <option value="10">新能源与储能</option>
                </select>
            </div>

            <!-- 技术指标 -->
            <div class="form-group">
                <label>技术指标：</label>
                <div class="upload-area" onclick="document.getElementById('techFile').click()">
                    <div class="upload-icon">📄</div>
                    <div class="upload-text">点击上传 PDF / 图片</div>
                    <div class="upload-hint">支持 PDF、JPG、PNG 格式，单个文件不超过 10MB</div>
                </div>
                <input type="file" id="techFile" accept=".pdf,.jpg,.jpeg,.png" multiple onchange="handleFileUpload(this)">
                <div class="file-list" id="fileList"></div>
            </div>

            <!-- 期望价格区间 -->
            <div class="form-group">
                <label><span class="required">*</span>期望价格区间：</label>
                <div class="price-range">
                    <div class="price-input-wrap">
                        <span class="currency">¥</span>
                        <input type="number" id="minPrice" placeholder="最低价" min="0" step="0.01">
                    </div>
                    <span class="separator">~</span>
                    <div class="price-input-wrap">
                        <span class="currency">¥</span>
                        <input type="number" id="maxPrice" placeholder="最高价" min="0" step="0.01">
                    </div>
                </div>
                <div class="form-tip">请填写合理的价格区间，有助于买家找到您的产品</div>
            </div>

            <!-- 是否需要ECEE检测 -->
            <div class="form-group">
                <label>是否需要ECEE检测： <a href="../info/ece.html" style="font-size:12px;color:#0a4db4;font-weight:normal;margin-left:8px;">🏅 了解ECEE认证 →</a></label>
                <div class="radio-group">
                    <label class="radio-item">
                        <input type="radio" name="eccee" value="yes" checked>
                        <span class="radio-label">需要</span>
                    </label>
                    <label class="radio-item">
                        <input type="radio" name="eccee" value="no">
                        <span class="radio-label">不需要</span>
                    </label>
                </div>
            </div>

            <!-- 企业/联系人 -->
            <div class="form-group">
                <label><span class="required">*</span>企业/联系人：</label>
                <input type="text" id="contactName" placeholder="请输入企业名称或联系人姓名" required>
            </div>

            <!-- 联系电话 -->
            <div class="form-group">
                <label><span class="required">*</span>联系电话：</label>
                <input type="text" id="contactPhone" placeholder="请输入联系电话，如：13800138000" required>
            </div>

            <!-- 提交按钮 -->
            <div class="submit-area">
                <button type="submit" class="submit-btn">
                    <span class="btn-icon">✅</span>
                    提交审核（48小时上架）
                </button>
                <div class="submit-hint">
                    提交后，我们将在 <b>48 小时</b> 内完成审核并上架您的产品/需求
                </div>
            </div>
        </form>
    </div>

    <!-- 底部链接 -->
    <div class="bottom-links">
        <a href="../../neep.html">← 返回首页</a>
    </div>
</div>

<!-- ============ 成功提示弹窗 ============ -->
<div class="success-overlay" id="successOverlay">
    <div class="success-modal">
        <div class="check-icon">✓</div>
        <h3>提交成功！</h3>
        <p>您的信息已提交审核，我们将在 48 小时内完成审核并上架。</p>
        <button onclick="closeSuccess()">好的，知道了</button>
    </div>
</div>

<script>
/* ============ 当前发布类型 ============ */
let currentType = 'sell';
let uploadedFiles = [];

/* ============ 类型切换 ============ */
function switchType(type) {
    currentType = type;
    document.querySelectorAll('.type-tab').forEach(t => {
        t.classList.toggle('active', t.dataset.type === type);
    });

    const labels = {
        buy: { title: '发布您的采购需求', name: '需求名称' },
        sell: { title: '发布您的产品信息', name: '产品名称' },
        coop: { title: '发布您的合作意向', name: '合作项目名称' }
    };
    const label = labels[type];
    document.getElementById('sectionTitle').textContent = label.title;
    document.getElementById('nameLabel').textContent = label.name;

    // 切换时可调整默认值
    const priceMin = document.getElementById('minPrice');
    const priceMax = document.getElementById('maxPrice');
    if (type === 'buy') {
        priceMin.placeholder = '预算下限';
        priceMax.placeholder = '预算上限';
    } else if (type === 'sell') {
        priceMin.placeholder = '最低售价';
        priceMax.placeholder = '最高售价';
    } else {
        priceMin.placeholder = '合作金额下限';
        priceMax.placeholder = '合作金额上限';
    }
}

/* ============ 文件上传 ============ */
function handleFileUpload(input) {
    const files = Array.from(input.files);
    files.forEach(f => {
        if (uploadedFiles.length >= 5) {
            alert('最多上传5个文件');
            return;
        }
        if (f.size > 10 * 1024 * 1024) {
            alert(`文件 ${f.name} 超过10MB限制`);
            return;
        }
        uploadedFiles.push(f.name);
    });
    renderFileList();
    input.value = '';
}

function renderFileList() {
    const list = document.getElementById('fileList');
    list.innerHTML = uploadedFiles.map((name, idx) => `
        <div class="file-item">
            <span>📎 ${name}</span>
            <span class="remove-file" onclick="removeFile(${idx})">✕</span>
        </div>
    `).join('');
}

function removeFile(idx) {
    uploadedFiles.splice(idx, 1);
    renderFileList();
}

/* ============ 提交表单 ============ */
function submitForm(e) {
    e.preventDefault();

    const name = document.getElementById('itemName').value.trim();
    const category = document.getElementById('category').value;
    const minPrice = document.getElementById('minPrice').value;
    const maxPrice = document.getElementById('maxPrice').value;
    const contactName = document.getElementById('contactName').value.trim();
    const contactPhone = document.getElementById('contactPhone').value.trim();

    if (!name || !category || !contactName || !contactPhone) {
        alert('请填写所有必填项');
        return;
    }

    if (minPrice && maxPrice && Number(minPrice) > Number(maxPrice)) {
        alert('最低价不能大于最高价');
        return;
    }

    // 模拟提交
    showSuccess();
}

/* ============ 成功提示 ============ */
function showSuccess() {
    document.getElementById('successOverlay').classList.add('show');
}

function closeSuccess() {
    document.getElementById('successOverlay').classList.remove('show');
    resetForm();
}

function resetForm() {
    document.getElementById('publishForm').reset();
    uploadedFiles = [];
    renderFileList();
    switchType('sell');
}

/* ============ 返回 ============ */
function goBack() {
    if (document.referrer && document.referrer.indexOf('neep') !== -1) {
        history.back();
    } else {
        window.location.href = '../../neep.html';
    }
}
</script>

</body>
</html>
