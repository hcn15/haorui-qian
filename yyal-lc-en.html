	<script>
		// 接口地址
		const apiUrl = `${SERVER_BASE_URL}/website/scene`;
		// 当前英文页面匹配链接（改成你当前页面的英文链接）
		const targetHref = './yyal-lc-en.html';

		window.onload = function () {
			fetch(apiUrl)
				.then(res => res.json())
				.then(res => {
					if (res.code !== 0 || !Array.isArray(res.data)) return;
					// 匹配英文跳转链接
					let currData = res.data.find(item => item.hrefToEn === targetHref);
					if (!currData) return;

					// ============== 全部使用英文字段 ==============
					const {
						hrefToFirstImageUrlEn,
						hrefToTitleEn,
						hrefToDateEn,
						hrefToImageUrlEn,
						typeEn
					} = currData;

					// 1、顶部Banner
					document.getElementById('bannerImgWrap').innerHTML = `
                    <img class="img1" src="${hrefToFirstImageUrlEn}" alt="${hrefToTitleEn}" style="height:100%; width:100%; object-fit:cover; display:block; border:0; outline:0;">
                    <img class="img2" src="${hrefToFirstImageUrlEn}" alt="${hrefToTitleEn}" style="height:100%; width:100%; object-fit:cover; display:block; border:0; outline:0;">
                `;

					// 面包屑
					document.getElementById('navTypeName').innerText = hrefToTitleEn;

					// 标题 + 日期
					document.getElementById('detailTitle').innerText = hrefToTitleEn;
					document.getElementById('publishDate').innerText = `Published: ${hrefToDateEn}`;

					// 详情大图
					document.getElementById('detailImgWrap').innerHTML = `
                    <img loading="lazy" class="img1" src="${hrefToImageUrlEn}" alt="${hrefToTitleEn}" style="width: 70% !important; height: auto !important; margin: 0 auto !important; display: block !important; position: relative !important; z-index: 9999 !important;">
                    <img loading="lazy" class="img2" src="${hrefToImageUrlEn}" alt="${hrefToTitleEn}" style="display: none !important;">
                `;
				})
				.catch(err => {
					console.log('API request failed：', err)
				})
		}
	</script>

			loop: true,
			slidesPerView: 3.6,
			loopedSlides: 8,
			spaceBetween: 45,
			// roundLengths : true,
			breakpoints: {
				991: {
					slidesPerView: 2.2,
				},
				767: {
					slidesPerView: 1,
				}
			},
		});

		$(document).ready(function () {
			$('.hfo .box .hfo_box .gr').matchHeight();
		});

		var swip3 = new Swiper('.htw .box .box_b .swiper-container', {
			speed: 1000,
			autoplay: {
				delay: 5000,
				stopOnLastSlide: false,
				disableOnInteraction: false,
				pauseOnMouseEnter: true,
			},
			watchOverflow: true,//仅有1个slide，swiper无效
			loop: true,
			slidesPerView: 3,
			spaceBetween: 20,
			// roundLengths : true,

	</script>


	<script type="text/javascript">
			(function () {
				var tab_tit = document.getElementById('think_page_trace_tab_tit').getElementsByTagName('span');
				var tab_cont = document.getElementById('think_page_trace_tab_cont').getElementsByTagName('div');
				var open = document.getElementById('think_page_trace_open');
				var close = document.getElementById('think_page_trace_close').children[0];
				var trace = document.getElementById('think_page_trace_tab');
				var cookie = document.cookie.match(/thinkphp_show_page_trace=(\d\|\d)/);
				var history = (cookie && typeof cookie[1] != 'undefined' && cookie[1].split('|')) || [0, 0];
				open.onclick = function () {
					trace.style.display = 'block';
					this.style.display = 'none';
					close.parentNode.style.display = 'block';
					history[0] = 1;
					document.cookie = 'thinkphp_show_page_trace=' + history.join('|')
				}
				close.onclick = function () {
					trace.style.display = 'none';
					this.parentNode.style.display = 'none';
					open.style.display = 'block';
					history[0] = 0;
					document.cookie = 'thinkphp_show_page_trace=' + history.join('|')
				}
				for (var i = 0; i < tab_tit.length; i++) {
					tab_tit[i].onclick = (function (i) {
						return function () {
							for (var j = 0; j < tab_cont.length; j++) {
								tab_cont[j].style.display = 'none';
								tab_tit[j].style.color = '#999';
							}
							tab_cont[i].style.display = 'block';
							tab_tit[i].style.color = '#000';
							history[1] = i;
							document.cookie = 'thinkphp_show_page_trace=' + history.join('|')
						}
					})(i)
				}
				parseInt(history[0]) && open.click();
				tab_tit[history[1]].click();
			})();
	</script>
